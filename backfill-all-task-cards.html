        // API helper function
        async function codaAPI(endpoint, method = 'GET', body = null) {
            const url = `https://coda.io/apis/v1/docs/${CODA_DOC_ID}${endpoint}`;
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${CODA_API_TOKEN}`,
                    'Content-Type': 'application/json'
                }
            };
            if (body) options.body = JSON.stringify(body);

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${data.message || 'API Error'}`);
                }
                return data;
            } catch (error) {
                console.error('Coda API Error:', error);
                throw error;
            }
        }

            const div = document.createElement('div');

        }

            const progressElement = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            const percentage = Math.round((current / total) * 100);
            
            progressElement.style.display = 'block';
            progressBar.style.width = `${percentage}%`;
            progressBar.textContent = `${percentage}% (${current}/${total})`;

                    <p>Series</p>
                </div>
                <div class="stat-card">
                    <h3>${difficulties.Easy || 0}</h3>
                    <p>Easy Cards</p>
                </div>
                <div class="stat-card">
                    <h3>${difficulties.Medium || 0}</h3>
                    <p>Medium Cards</p>
                </div>
                <div class="stat-card">
                    <h3>${difficulties.Hard || 0}</h3>
                    <p>Hard Cards</p>
                </div>
            `;
            stats.style.display = 'grid';
        }

        // Preview cards
        function previewCards() {
            const cardList = document.getElementById('cardList');
            const cardPreview = document.getElementById('cardPreview');
            
            cardList.innerHTML = '';
            
            allScannedCards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = `card-preview ${card.difficulty.toLowerCase()}`;
                div.innerHTML = `
                    <div class="card-number">${card.cardNumber}</div>
                    <div class="difficulty-label">${card.difficulty.toUpperCase()} LEVEL</div>
                    <div class="card-header">
                        <i data-lucide="${card.icon}" class="card-icon"></i>
                        <div class="card-title">${card.title}</div>
                    </div>
                    <div class="card-content">
                        <div class="instructions">${card.instructions}</div>
                        <div class="series-info">
                            <strong>Series:</strong> ${card.subject} → ${card.unit} → ${card.series}
                        </div>
                    </div>
                `;
                cardList.appendChild(div);
                
                // Initialize Lucide icons for this card
                setTimeout(() => {
                    lucide.createIcons();
                }, 10);
            });
            
            cardPreview.style.display = 'block';
            showMessage(`📋 Preview ready! ${allScannedCards.length} cards with exact Hamilton formatting.`, 'info');
        }

        // Clear existing cards
        async function clearExistingCards() {
            try {
                showMessage('🗑️ Clearing existing cards from Coda table...', 'info');
                
                const data = await codaAPI(`/tables/${TABLE_ID}/rows`);
                const existingRows = data.items || [];
                
                if (existingRows.length === 0) {
                    showMessage('ℹ️ No existing cards found to clear.', 'info');
                    return;
                }
                
                for (let i = 0; i < existingRows.length; i++) {
                    await codaAPI(`/tables/${TABLE_ID}/rows/${existingRows[i].id}`, 'DELETE');
                    updateProgress(i + 1, existingRows.length);
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                
                showMessage(`✅ Cleared ${existingRows.length} existing cards!`, 'success');
                document.getElementById('progress').style.display = 'none';
                
            } catch (error) {
                showMessage(`❌ Error clearing cards: ${error.message}`, 'error');
            }
        }

        // Upload all cards to Coda
        async function uploadAllCards() {
            try {
                showMessage('🚀 Uploading all cards to Coda...', 'info');
                
                let uploaded = 0;
                
                for (let i = 0; i < allScannedCards.length; i++) {
                    const card = allScannedCards[i];
                    
                    const cells = [
                        { column: COLUMN_MAPPING.cardNumber, value: card.cardNumber },
                        { column: COLUMN_MAPPING.difficulty, value: card.difficulty },
                        { column: COLUMN_MAPPING.title, value: card.title },
                        { column: COLUMN_MAPPING.icon, value: card.icon },
                        { column: COLUMN_MAPPING.instructions, value: card.instructions },
                        { column: COLUMN_MAPPING.directions, value: card.directions },
                        { column: COLUMN_MAPPING.sentenceFrame, value: card.sentenceFrame },
                        { column: COLUMN_MAPPING.hints, value: card.hints },
                        { column: COLUMN_MAPPING.subject, value: card.subject },
                        { column: COLUMN_MAPPING.unit, value: card.unit },
                        { column: COLUMN_MAPPING.series, value: card.series }
                    ];
                    
                    let success = false;
                    let attempts = 0;
                    
                    while (!success && attempts < 3) {
                        try {
                            await codaAPI(`/tables/${TABLE_ID}/rows`, 'POST', { 
                                rows: [{ cells }] 
                            });
                            success = true;
                            uploaded++;
                            updateProgress(uploaded, allScannedCards.length);
                            
                            // Longer delay to avoid rate limits
                            if (i < allScannedCards.length - 1) {
                                await new Promise(resolve => setTimeout(resolve, 2500));
                            }
                            
                        } catch (error) {
                            attempts++;
                            if (error.message.includes('429')) {
                                const waitTime = Math.pow(2, attempts) * 3000;
                                showMessage(`⏳ Rate limited. Waiting ${waitTime/1000}s (card ${i+1}/${allScannedCards.length})...`, 'info');
                                await new Promise(resolve => setTimeout(resolve, waitTime));
                            } else {
                                throw error;
                            }
                        }
                    }
                    
                    if (!success) {
                        throw new Error(`Failed to upload card ${card.cardNumber} after 3 attempts`);
                    }
                }
                
                showMessage(`🎉 Successfully uploaded ${allScannedCards.length} task cards to Coda!`, 'success');
                showMessage(`🔗 Your master task cards page is ready: chelce.github.io/dhs/task-cards-master.html`, 'info');
                document.getElementById('progress').style.display = 'none';
                
            } catch (error) {
                showMessage(`❌ Error uploading cards: ${error.message}`, 'error');
            }
        }

        // Event listeners
        document.getElementById('scanBtn').addEventListener('click', scanAllCards);
        document.getElementById('previewBtn').addEventListener('click', previewCards);
        document.getElementById('clearBtn').addEventListener('click', clearExistingCards);
        document.getElementById('uploadBtn').addEventListener('click', uploadAllCards);

        // Initial message
        showMessage('👋 Ready to backfill all your task cards! This includes Hamilton and Analogies cards with proper organization.', 'info');
    </script>
</body>
</html>
