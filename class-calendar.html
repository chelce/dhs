// TipTap 3.0 ES Module imports
import { Editor } from 'https://esm.sh/@tiptap/core';
import StarterKit from 'https://esm.sh/@tiptap/starter-kit';
import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder';

// Make TipTap available globally for the rest of the script
window.TiptapEditor = Editor;
window.TiptapStarterKit = StarterKit;
window.TiptapPlaceholder = Placeholder;
window.tiptapLoaded = true;
console.log('TipTap 3.0 ES modules loaded successfully');
</script>
<script>
async function ensureEditors(){
  // Debug: Log what's available
  console.log('TipTap globals available:', {
    TiptapEditor: !!window.TiptapEditor,
    TiptapStarterKit: !!window.TiptapStarterKit,
    TiptapPlaceholder: !!window.TiptapPlaceholder,
    tiptapLoaded: !!window.tiptapLoaded,
    lucide: !!window.lucide
  });
  
  // TipTap 3.0 ES module approach
  if (window.tiptapLoaded && window.TiptapEditor) {
    console.log('TipTap 3.0 ES modules detected, initializing editors');
    initEditors();
    if (notesEditor && detailsEditor) {
      console.log('TipTap 3.0 editors created successfully');
      return;
    }
  }
  
  // Wait a bit for modules to load
  console.log('Waiting 2s for ES modules to load...');
  await new Promise(r => setTimeout(r, 2000));
  
  console.log('After delay - TipTap globals:', {
    TiptapEditor: !!window.TiptapEditor,
    TiptapStarterKit: !!window.TiptapStarterKit,
    TiptapPlaceholder: !!window.TiptapPlaceholder,
    tiptapLoaded: !!window.tiptapLoaded
  });
  
  if (window.tiptapLoaded && window.TiptapEditor) {
    console.log('TipTap 3.0 available after delay, trying again');
    initEditors();
    if (notesEditor && detailsEditor) {
      console.log('TipTap 3.0 editors created on retry');
      return;
    }
  }
  
  // Fallback to contentEditable
  console.warn('TipTap 3.0 unavailable, using fallback contentEditable editors');
  const enEd = document.getElementById('eventNotesEditor');
  const dnEd = document.getElementById('detailsNotesEditor');
  
  if (enEd) {
    enEd.contentEditable = 'true';
    enEd.innerHTML = '<p>Start typing your notes...</p>';
  }
  if (dnEd) {
    dnEd.contentEditable = 'true'; 
    dnEd.innerHTML = '<p>Add reflection notes...</p>';
  }
  
  buildFallbackToolbar(document.getElementById('eventNotesMenu'));
  buildFallbackToolbar(document.getElementById('detailsNotesMenu'));
}
</script>

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => init());
} else { init(); }

async function init(){
  initSupabase();
  wireUI();
  await ensureEditors();
  
  // CLOUD-FIRST APPROACH: Only use localStorage as fallback
  const remoteLoaded = await loadRemoteEvents();
  if (!remoteLoaded || !supabase) {
    console.warn('🔄 Cloud unavailable - falling back to local storage');
    loadLocalEvents();
  } else {
    console.log('☁️ Cloud data loaded successfully - skipping localStorage');
    // Clear any stale local data since we have cloud data
    localStorage.removeItem('calendar_events_user');
  }
  
  render();
}

function initSupabase(){
  try { supabase = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){ console.warn('Supabase init failed', e); supabase = null; }
}

function wireUI(){
  document.getElementById('prevWeekBtn').onclick=()=>{weekOffset--;render();};
  document.getElementById('nextWeekBtn').onclick=()=>{weekOffset++;render();};
  document.getElementById('resetViewBtn').onclick=()=>{weekOffset=0;render();};
  document.getElementById('addEventBtn').onclick=()=>openAddModal();
  document.querySelectorAll('.filter-checkbox input').forEach(cb=>cb.addEventListener('change',applyFilters));
  document.querySelectorAll('.close,[data-close]').forEach(el=>el.addEventListener('click',()=>closeModal(el.getAttribute('data-close'))));
  document.getElementById('eventForm').addEventListener('submit',saveNewEvent);
  document.getElementById('saveDetailsBtn').addEventListener('click',saveDetailsNotes);
  document.getElementById('deleteEventBtn').addEventListener('click',deleteCurrentEvent);
}

function initEditors(){
  // TipTap 3.0 validation
  if(!window.TiptapEditor){
    console.error('TipTap 3.0 Editor constructor missing; check ES module loading');
    return;
  }

  console.log('Attempting to initialize TipTap 3.0 editors...');
  
  // TipTap 3.0 extensions
  console.log('Available extensions:', {
    StarterKit: !!window.TiptapStarterKit,
    Placeholder: !!window.TiptapPlaceholder
  });
  
  const extensions = [];
  
  // Add StarterKit
  if (window.TiptapStarterKit) {
    extensions.push(window.TiptapStarterKit);
    console.log('Added StarterKit extension');
  }
  
  // Add Placeholder
  if (window.TiptapPlaceholder) {
    extensions.push(window.TiptapPlaceholder.configure({ 
      placeholder: 'Start typing…' 
    }));
    console.log('Added Placeholder extension');
  }
  
  if (extensions.length === 0) {
    console.error('No TipTap extensions available - this will likely fail');
    return;
  }
  
  try {
    if(notesEditor||detailsEditor){ 
      console.log('Editors already exist, skipping initialization');
      return; 
    }
    
    console.log('Creating notesEditor...');
    notesEditor = new window.TiptapEditor({
      element: document.getElementById('eventNotesEditor'),
      extensions: extensions,
      content: '<p></p>',
      onUpdate: ({ editor }) => { 
        document.getElementById('eventNotes').value = editor.getHTML(); 
      }
    });
    console.log('notesEditor created successfully');
    
    console.log('Creating detailsEditor...');
    detailsEditor = new window.TiptapEditor({
      element: document.getElementById('detailsNotesEditor'),
      extensions: extensions,
      content: '<p></p>',
      onUpdate: () => {}
    });
    console.log('detailsEditor created successfully');
    
    // Build TipTap 3.0 toolbars with Lucide icons
    console.log('Building toolbars...');
    buildTipTap3Toolbar(notesEditor, document.getElementById('eventNotesMenu'));
    buildTipTap3Toolbar(detailsEditor, document.getElementById('detailsNotesMenu'));
    
    setupEditorEnhancements(notesEditor);
    setupEditorEnhancements(detailsEditor);
    
    console.log('TipTap 3.0 editors initialized successfully');
  } catch (e) {
    console.error('TipTap 3.0 init failed:', e);
    console.warn('Using fallback contentEditable editors');
    
    // Clear any partial initialization
    notesEditor = null;
    detailsEditor = null;
    
    document.getElementById('eventNotesEditor').contentEditable = 'true';
    document.getElementById('detailsNotesEditor').contentEditable = 'true';
    buildFallbackToolbar(document.getElementById('eventNotesMenu'));
    buildFallbackToolbar(document.getElementById('detailsNotesMenu'));
  }
}

      <button type="button" class="toolbar-btn" data-action="code" title="Code">&lt;/&gt;</button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-action="heading1" title="Heading 1">H1</button>
      <button type="button" class="toolbar-btn" data-action="heading2" title="Heading 2">H2</button>

    </div>

      <button type="button" class="toolbar-btn" data-action="orderedList" title="Numbered List">1.</button>
      <button type="button" class="toolbar-btn" data-action="blockquote" title="Quote">❝</button>
    </div>
  `;
  
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('.toolbar-btn');
    if (!btn || !editor) return;
    
    const action = btn.dataset.action;
    const chain = editor.chain().focus();
    
    switch (action) {
      case 'undo': chain.undo().run(); break;
      case 'redo': chain.redo().run(); break;
      case 'bold': chain.toggleBold().run(); break;
      case 'italic': chain.toggleItalic().run(); break;
      case 'code': chain.toggleCode().run(); break;
      case 'heading1': chain.toggleHeading({ level: 1 }).run(); break;

      case 'paragraph': chain.setParagraph().run(); break;
      case 'bulletList': chain.toggleBulletList().run(); break;
      case 'orderedList': chain.toggleOrderedList().run(); break;
      case 'blockquote': chain.toggleBlockquote().run(); break;
    }
    
    updateWorkingToolbar(editor, el);
  });

  editor.on('selectionUpdate', () => updateWorkingToolbar(editor, el));
  editor.on('transaction', () => updateWorkingToolbar(editor, el));
  
  updateWorkingToolbar(editor, el);

function updateWorkingToolbar(editor, el) {
  if (!editor || !el) return;

// Fallback toolbar for when TipTap fails completely
function buildFallbackToolbar(el) {
  if (!el) return;
  
  el.innerHTML = `
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-action="bold" title="Bold"><strong>B</strong></button>
      <button type="button" class="toolbar-btn" data-action="italic" title="Italic"><em>I</em></button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button type="button" class="toolbar-btn" data-action="insertText" title="Add Text">Text</button>
    </div>
  `;
  
  el.addEventListener('click', (e) => {
    const btn = e.target.closest('.toolbar-btn');
    if (!btn) return;
    
    const action = btn.dataset.action;
    
    switch (action) {
      case 'bold':
        document.execCommand('bold', false, null);
        break;
      case 'italic':
        document.execCommand('italic', false, null);
        break;
      case 'insertText':
        const text = prompt('Enter text:');
        if (text) document.execCommand('insertText', false, text);
        break;
    }
  });
}

function buildReplicaToolbar(editor, el){
  if(!el) return; if(!editor || !editor.chain){
    // Fallback simple menu if editor not available yet
    buildSimpleMenu(null, el); return;
  }
  el.innerHTML='';
  const groups = [
    [ {act:'undo', icon:'undo', title:'Undo'}, {act:'redo', icon:'redo', title:'Redo'} ],
    [ {act:'bold', icon:'bold', title:'Bold'}, {act:'italic', icon:'italic', title:'Italic'}, {act:'underline', icon:'underline', title:'Underline'}, {act:'strike', icon:'strikethrough', title:'Strikethrough'}, {act:'code', icon:'code', title:'Inline Code'}, {act:'highlight', icon:'highlighter', title:'Highlight'} ],
    [ {dropdown:'heading'} ],
  [ {act:'paragraph', icon:'pilcrow', title:'Paragraph'}, {act:'bulletList', icon:'list', title:'Bullet List'}, {act:'orderedList', icon:'list-ordered', title:'Ordered List'}, {act:'taskList', icon:'check-square', title:'Task List'}, {act:'blockquote', icon:'quote', title:'Blockquote'}, {act:'codeBlock', icon:'file-code-2', title:'Code Block'}, {act:'hr', icon:'minus', title:'Horizontal Rule'} ],
  [ {act:'align-left', icon:'align-left', title:'Align Left'}, {act:'align-center', icon:'align-center', title:'Align Center'}, {act:'align-right', icon:'align-right', title:'Align Right'}, {act:'align-justify', icon:'align-justify', title:'Justify'} ],
  [ {act:'image-file', icon:'image', title:'Insert Image (Upload)'}, {act:'image-url', icon:'link-2', title:'Insert Image (URL)'}, {act:'youtube', icon:'video', title:'Embed YouTube'}, ],
  [ {act:'link', icon:'link', title:'Add Link'}, {act:'unlink', icon:'unlink-2', title:'Remove Link'}, {act:'clear', icon:'eraser', title:'Clear Formatting'} ]
  ];
  groups.forEach((grp,i)=>{
    const wrap=document.createElement('div'); wrap.className='toolbar-group';
    grp.forEach(item=>{
      if(item.dropdown==='heading'){
        const dd=document.createElement('div'); dd.className='heading-dropdown';
        const btn=document.createElement('button'); btn.type='button'; btn.className='toolbar-btn heading-trigger'; btn.innerHTML='<i data-lucide="type"></i><span class="current-heading">Text</span>';
        btn.addEventListener('click',()=>{ dd.classList.toggle('open'); });
        const menu=document.createElement('div'); menu.className='heading-menu';
        [['Paragraph','paragraph'],['Heading 1','h1'],['Heading 2','h2'],['Heading 3','h3']].forEach(([label,mode])=>{
          const mb=document.createElement('button'); mb.textContent=label; mb.dataset.mode=mode; mb.addEventListener('click',()=>{
            dd.classList.remove('open');
            const ch=editor.chain().focus();
            if(mode==='paragraph') ch.setParagraph().run(); else ch.toggleHeading({level:parseInt(mode.slice(1),10)}).run();
            updateReplicaToolbar(editor, el);
          }); menu.appendChild(mb); });
        dd.appendChild(btn); dd.appendChild(menu); wrap.appendChild(dd);
      } else {
        const b=document.createElement('button'); b.type='button'; b.className='toolbar-btn'; b.dataset.act=item.act; b.title=item.title||''; b.innerHTML=`<i data-lucide="${item.icon}"></i>`; wrap.appendChild(b);
      }
    });
    el.appendChild(wrap);
    if(i<groups.length-1){ const div=document.createElement('div'); div.className='toolbar-divider'; el.appendChild(div); }
  });
  // hidden file input for image uploads
  const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  fileInput.addEventListener('change',()=>{
    const f=fileInput.files?.[0]; if(!f) return; const reader=new FileReader(); reader.onload=()=>{ const src=reader.result; if(src) { editor.chain().focus().setImage({src}).run(); updateReplicaToolbar(editor, el);} }; reader.readAsDataURL(f); fileInput.value=''; });
  el.appendChild(fileInput);
  el.addEventListener('click', ev=>{
    const btn=ev.target.closest('button.toolbar-btn'); if(!btn||!btn.dataset.act) return; const act=btn.dataset.act; const ch=editor.chain().focus();
    switch(act){
      case 'undo': ch.undo().run(); break; case 'redo': ch.redo().run(); break;
      case 'bold': ch.toggleBold().run(); break; case 'italic': ch.toggleItalic().run(); break; case 'underline': ch.toggleUnderline?.().run(); break; case 'strike': ch.toggleStrike().run(); break; case 'code': ch.toggleCode().run(); break; case 'highlight': editor.isActive('highlight')?ch.unsetHighlight().run():ch.setHighlight().run(); break;
      case 'paragraph': ch.setParagraph().run(); break; case 'bulletList': ch.toggleBulletList().run(); break; case 'orderedList': ch.toggleOrderedList().run(); break; case 'taskList': ch.toggleTaskList().run(); break; case 'blockquote': ch.toggleBlockquote().run(); break; case 'codeBlock': ch.toggleCodeBlock().run(); break; case 'hr': ch.setHorizontalRule().run(); break;
      case 'align-left': ch.setTextAlign('left').run(); break; case 'align-center': ch.setTextAlign('center').run(); break; case 'align-right': ch.setTextAlign('right').run(); break; case 'align-justify': ch.setTextAlign('justify').run(); break;
      case 'image-file': fileInput.click(); break;
      case 'image-url': { const url=prompt('Image URL'); if(url) ch.setImage({src:url}).run(); break; }
      case 'youtube': { const yUrl=prompt('YouTube URL'); if(yUrl){ ch.setYoutubeVideo({ src:yUrl }).run(); } break; }
      case 'link': { const url=prompt('Enter URL'); if(url) ch.setLink({href:url}).run(); break; }
      case 'unlink': ch.unsetLink().run(); break; case 'clear': ch.clearNodes().unsetAllMarks().run(); break;
    }
    updateReplicaToolbar(editor, el);
  });
  document.addEventListener('click',e=>{ if(!el.contains(e.target)) el.querySelectorAll('.heading-dropdown.open').forEach(dd=>dd.classList.remove('open')); });
  editor.on('transaction', ()=>updateReplicaToolbar(editor, el));
  try { lucide?.createIcons?.(); } catch(_){ /* ignore */ }
  updateReplicaToolbar(editor, el);
}

function updateReplicaToolbar(editor, el){
  if(!el) return; if(!editor || !editor.isActive){ return; }
  // active states
  el.querySelectorAll('button.toolbar-btn').forEach(btn=>{
    const act=btn.dataset.act; let active=false;
    switch(act){
  case 'bold': active=editor.isActive('bold'); break; case 'italic': active=editor.isActive('italic'); break; case 'underline': active=editor.isActive('underline'); break; case 'strike': active=editor.isActive('strike'); break; case 'code': active=editor.isActive('code'); break; case 'highlight': active=editor.isActive('highlight'); break; case 'paragraph': active=editor.isActive('paragraph'); break; case 'bulletList': active=editor.isActive('bulletList'); break; case 'orderedList': active=editor.isActive('orderedList'); break; case 'taskList': active=editor.isActive('taskList'); break; case 'blockquote': active=editor.isActive('blockquote'); break; case 'codeBlock': active=editor.isActive('codeBlock'); break; case 'align-left': active=editor.isActive({textAlign:'left'}); break; case 'align-center': active=editor.isActive({textAlign:'center'}); break; case 'align-right': active=editor.isActive({textAlign:'right'}); break; case 'align-justify': active=editor.isActive({textAlign:'justify'}); break; case 'link': active=editor.isActive('link'); break;
    }
    btn.classList.toggle('is-active', !!active);
  });
  const currentHeading = el.querySelector('.current-heading');
  if(currentHeading){
    if(editor.isActive('heading',{level:1})) currentHeading.textContent='H1';
    else if(editor.isActive('heading',{level:2})) currentHeading.textContent='H2';
    else if(editor.isActive('heading',{level:3})) currentHeading.textContent='H3';
    else currentHeading.textContent='Text';
  }
  lucide?.createIcons?.();
}

/* ========= ENHANCEMENTS: image removal, task list drag reorder, paste auto-embed ========= */
function setupEditorEnhancements(editor){
  if(!editor) return;
  
  // Auto-embed on paste (YouTube / image)
  const el = editor.view.dom;
  el.addEventListener('paste', (e)=>{
    setTimeout(()=>{ // allow paste insertion
      try {
        const selText = editor.state.doc.textBetween(editor.state.selection.from-300, editor.state.selection.to+300, '\n', '\n');
        const urlMatch = /(https?:\/\/[^\s<>'"`]+)$/m.exec(selText.trim());
        if(!urlMatch) return;
        const url = urlMatch[1];
        // YouTube
        const yt = /(?:https?:\/\/(?:www\.)?youtu\.be\/([\w-]{6,})|youtube\.com\/watch\?v=([\w-]{6,}))/i.exec(url);
        if(yt){ 
          // Only if YouTube extension is available
          if(editor.commands.setYoutubeVideo) {
            editor.chain().focus().setYoutubeVideo({ src: url }).run(); 
            return; 
          }
        }
        // Image by extension
        if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url)){
          // Only if Image extension is available
          if(editor.commands.setImage) {
            editor.chain().focus().setImage({ src:url }).run();
          }
        }
      } catch(err){ console.warn('auto-embed paste err', err); }
    },10);
  });
  
  // Image remove (Shift+Click) - simplified version
  el.addEventListener('click', ev=>{
    const img = ev.target.closest('img');
    if(img && ev.shiftKey){
      if(confirm('Remove image?')){
        // Simple approach - just remove the DOM element
        img.remove();
      }
    }
  });
  
  console.log('Editor enhancements setup completed');
}

function reorderTaskItems(editor, fromIdx, toIdx){
  try {
    // naive: rebuild task list order based on DOM and setContent for that list only
    const root = editor.view.dom.querySelector('ul[data-type="taskList"]');
    if(!root) return;
    const items = Array.from(root.children);
    const moving = items[fromIdx]; if(!moving) return;
    root.removeChild(moving);
    if(toIdx>=items.length-1) root.appendChild(moving); else root.insertBefore(moving, items[toIdx]);
    // Replace entire task list node content
    const html = root.outerHTML;
    // Get full doc HTML and replace first taskList with new html
    const full = editor.getHTML();
    const updated = full.replace(/<ul data-type="taskList"[\s\S]*?<\/ul>/, html);
    editor.commands.setContent(updated, false);
  } catch(e){ console.warn('reorder task list error', e); }
}

/* ========= DATE / CALC ========= */
function mondayOfThisWeek(baseDate=new Date()){
  const d=new Date(baseDate); const dow=d.getDay(); const monIdx=dow===0?6:dow-1; d.setDate(d.getDate()-monIdx); return d;
}
function buildWeeks(){
  const centerMonday = mondayOfThisWeek();
  // apply offset in blocks of 1 week (movement shifts center week)
  centerMonday.setDate(centerMonday.getDate()+weekOffset*7);
  const weeks=[]; // 7 weeks: -3 .. +3 around center
  for(let w=-3; w<=3; w++){
    const start=new Date(centerMonday); start.setDate(centerMonday.getDate()+w*7);
    const week=[]; for(let i=0;i<7;i++){const d=new Date(start); d.setDate(start.getDate()+i); week.push({date:d,isToday:isSameDay(d,new Date()),isCenter:(w===0)});} weeks.push(week);
  }
  return weeks;
}
function isSameDay(a,b){return a.toISOString().slice(0,10)===b.toISOString().slice(0,10);} 
function fmtDate(d){return d.toISOString().slice(0,10);}

/* ========= REMOTE LOAD ========= */
async function loadRemoteEvents(){
  if(!supabase) {
    console.warn('Supabase not available - cannot load from cloud');
    return false;
  }
  
  try {
    const startRange = new Date(); startRange.setDate(startRange.getDate()-21);
    const endRange = new Date(); endRange.setDate(endRange.getDate()+21);
    console.log('☁️ Loading events from cloud database...');
    
    const { data, error } = await supabase.from('calendar_events').select('*').gte('event_date',fmtDate(startRange)).lte('event_date',fmtDate(endRange));
    
    if(error){
      console.error('❌ Remote fetch error:', error);
      return false;
    }
    
    console.log(`✅ Loaded ${data.length} events from cloud`);
    
    data.forEach(r=>{
      // avoid duplicates
      if(!events.some(e=>e.id===r.id)){
        // Handle both old single-class events and new multi-class events
        let eventClasses = [];
        if (r.event_classes) {
          try {
            eventClasses = JSON.parse(r.event_classes);
          } catch(e) {
            console.warn('Failed to parse event_classes, falling back to single class');
            eventClasses = [r.event_class];
          }
        } else {
          eventClasses = [r.event_class];
        }
        
        events.push({
          id: r.id || 'db-'+r.event_date+'-'+r.event_text.replace(/\s+/g,'_'),
          date: r.event_date,
          text: r.event_text,
          classes: eventClasses,
          class: eventClasses[0], // Keep for backwards compatibility
          isTentative: !!r.is_tentative,
          notes: r.notes || '',
          createdAt: r.created_at || r.event_date
        });
      }
    });
    
    return true; // Success
    
  } catch(e){ 
    console.error('❌ Remote load failed:', e); 
    return false;
  }
}

/* ========= LOCAL STORAGE (FALLBACK ONLY) ========= */
function loadLocalEvents(){
  try { 
    const raw=localStorage.getItem('calendar_events_user'); 
    if(!raw) {
      console.log('No local events found');
      return;
    }
    
    const arr=JSON.parse(raw); 
    console.log(`📱 Loading ${arr.length} events from local storage (fallback mode)`);
    
    arr.forEach(ev=>{ 
      if(!events.some(e=>e.id===ev.id)) {
        events.push(ev);
      }
    }); 
  } catch(e){
    console.warn('Local load error:', e);
  } 
}

function saveLocalEvents(){
  // CLOUD-FIRST: Only save locally as emergency backup
  if (!supabase) {
    console.log('💾 Saving to localStorage (cloud unavailable)');
    try { 
      localStorage.setItem('calendar_events_user', JSON.stringify(events)); 
    } catch(e){ 
      console.warn('Local save error:', e); 
    }
  } else {
    console.log('☁️ Cloud available - skipping localStorage save');
  }
}

/* ========= RENDER ========= */
function render(){
  const grid=document.getElementById('calendarGrid'); grid.innerHTML='';
  // headers
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  dayNames.forEach(n=>{const h=document.createElement('div');h.className='day-header';h.textContent=n;grid.appendChild(h);});
  const weeks=buildWeeks();
  // week labels + days
  weeks.forEach(week=>{
    week.forEach(dayInfo=>{
      const cell=document.createElement('div'); cell.className='day-cell';
      if(dayInfo.isToday) cell.classList.add('today');
      if(week[0].isCenter) cell.classList.add('current-week');
      const ds=fmtDate(dayInfo.date); cell.dataset.date=ds;
      const dn=document.createElement('div'); dn.className='day-number'; dn.textContent=dayInfo.date.getDate(); cell.appendChild(dn);
      // events for this day
      events.filter(e=>e.date===ds).forEach(ev=>addEventElement(cell,ev));
      setupDayDropZone(cell);
      cell.addEventListener('click',()=>openAddModal(ds));
      grid.appendChild(cell);
    });
  });
  updateWeekRange(weeks);
  applyFilters();
  renderUpcomingEvents();
}

/* ========= UPCOMING EVENTS ========= */
function renderUpcomingEvents() {
  const today = new Date();
  const nextWeek = new Date(today);
  nextWeek.setDate(today.getDate() + 7);
  
  const upcoming = events
    .filter(ev => {
      const eventDate = new Date(ev.date);
      return eventDate >= today && eventDate <= nextWeek;
    })
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 8); // Show max 8 events
  
  const container = document.getElementById('upcomingEvents');
  
  if (upcoming.length === 0) {
    container.innerHTML = '<div style="color: #666; font-style: italic;">No upcoming events this week</div>';
    return;
  }
  
  const html = upcoming.map(ev => {
    const eventDate = new Date(ev.date);
    const dayName = eventDate.toLocaleDateString('en', { weekday: 'short' });
    const monthDay = `${eventDate.getMonth() + 1}/${eventDate.getDate()}`;
    
    const eventClasses = ev.classes || [ev.class];
    const classLabels = eventClasses.map(cls => CLASS_META[cls]?.label || cls).join(', ');
    
    // For multi-class events, show gradient or first class color
    const classColor = eventClasses.length > 1 
      ? `linear-gradient(to right, ${eventClasses.map(cls => CLASS_META[cls]?.color || '#666').join(', ')})` 
      : CLASS_META[eventClasses[0]]?.color || '#666';
    
    return `
      <div class="upcoming-event">
        <div class="upcoming-date">${dayName}<br>${monthDay}</div>
        <div class="upcoming-class" style="background: ${classColor}">${classLabels}</div>
        <div class="upcoming-text">${ev.text}</div>
      </div>
    `;
  }).join('');
  
  container.innerHTML = html;
}

function updateWeekRange(weeks){
  const first=weeks[0][0].date; const last=weeks[weeks.length-1][6].date;
  document.getElementById('weekRange').textContent = `${first.getMonth()+1}/${first.getDate()}/${first.getFullYear()} - ${last.getMonth()+1}/${last.getDate()}/${last.getFullYear()}`;
  document.getElementById('monthYear').textContent = '7-Week View';
}

async function persistNewEvent(ev){
  if(!supabase) {
    console.warn('☁️ Cloud unavailable - event saved locally only');
    return;
  }
  
  try { 
    console.log('☁️ Saving new event to cloud database...');
    const { error } = await supabase.from('calendar_events').insert({
      event_date: ev.date, 
      year: parseInt(ev.date.slice(0,4),10), 
      month: parseInt(ev.date.slice(5,7),10)-1, 
      day: parseInt(ev.date.slice(8,10),10), 
      event_text: ev.text, 
      event_class: ev.classes ? ev.classes[0] : 'other', // Primary class for backwards compatibility
      event_classes: JSON.stringify(ev.classes || [ev.class]), // All classes as JSON
      notes: ev.notes, 
      is_tentative: ev.isTentative, 
      created_at: ev.createdAt
    }); 
    
    if(error) {
      console.error('❌ Cloud save error:', error);
    } else {
      console.log('✅ Event saved to cloud successfully');
    }
  } catch(e){ 
    console.error('❌ Cloud persist failed:', e);
  }

function addEventElement(parent, ev){
  const div=document.createElement('div'); 
  div.className='event'; 
  if(ev.isTentative) div.classList.add('tentative');
  
  // Handle both old single-class and new multi-class events
  const eventClasses = ev.classes || [ev.class];
  const primaryClass = eventClasses[0];
  
  div.dataset.id=ev.id; 
  div.dataset.class=primaryClass; 
  
  // Multi-class styling
  if (eventClasses.length > 1) {
    div.classList.add('multi-class');
    
    // Create color gradient for left border
    const colors = eventClasses.map(cls => CLASS_META[cls]?.color || '#666');
    div.style.setProperty('--class-colors', colors.join(', '));
    
    // Add class badges
    const badgesHtml = eventClasses.map(cls => 
      `<span class="class-badge" style="background: ${CLASS_META[cls]?.color || '#666'}" title="${CLASS_META[cls]?.label || cls}"></span>`
    ).join('');
    
    div.innerHTML = `<span>${ev.text}</span><div class="class-badges">${badgesHtml}</div><button class="delete-btn" title="Delete">×</button>`;
  } else {
    div.innerHTML = `<span>${ev.text}</span><button class="delete-btn" title="Delete">×</button>`;
  }
  
  // All events are now draggable
  div.setAttribute('draggable','true');
  div.title = 'Drag to move this event';
  
  div.addEventListener('click', (e)=>{ 
    if(e.target.classList.contains('delete-btn')){ 
      e.stopPropagation(); 
      deleteEvent(ev.id); 
    } else { 
      openDetails(ev.id); 
      e.stopPropagation(); 
    } 
  });
  
  // Setup drag for all events
  setupDrag(div);
  
  parent.appendChild(div);
}

function applyFilters(){
  const enabled={}; Object.keys(CLASS_META).forEach(k=>{const cb=document.getElementById('show-'+k); if(cb) enabled[k]=cb.checked;});
  document.querySelectorAll('.event').forEach(eventDiv => {
    const eventId = eventDiv.dataset.id;
    const event = events.find(e => e.id === eventId);
    
    if (event) {
      const eventClasses = event.classes || [event.class];
      // Show event if ANY of its classes are enabled
      const shouldShow = eventClasses.some(cls => enabled[cls]);
      eventDiv.style.display = shouldShow ? '' : 'none';
    }
  });
}

function openDetails(id){
  const ev=events.find(e=>e.id===id); if(!ev) return; currentEditId=id;

function deleteEvent(id){
  const idx=events.findIndex(e=>e.id===id); 
  if(idx===-1) return; 
  
  const ev=events[idx]; 
  
  // Remove from memory
  events.splice(idx,1); 
  
  // CLOUD-FIRST: Delete from cloud, backup locally only if cloud unavailable
  if(supabase){ 
    console.log('☁️ Deleting event from cloud database...');
    supabase.from('calendar_events')
      .delete()
      .eq('event_date',ev.date)
      .eq('event_text',ev.text)
      .eq('event_class',ev.class)
      .then(result => {
        console.log('✅ Event deleted from cloud:', result);

      .catch(error => {
        console.error('❌ Cloud delete failed:', error);
      });
  } else {
    console.warn('☁️ Cloud unavailable - updating local backup only');
  }
  
  saveLocalEvents(); // Only saves locally if cloud unavailable
  render();
}

/* ========= DRAG & DROP WITH SAFETY MEASURES ========= */
// Backup system for safe drag and drop
let dragBackupState = null;
let dragInProgress = false;

// Visual feedback for drag operations
function showDragIndicator(message, isError = false) {
  // Remove existing indicator
  const existing = document.querySelector('.drag-safety-indicator');
  if (existing) existing.remove();
  
  // Create new indicator
  const indicator = document.createElement('div');
  indicator.className = 'drag-safety-indicator';
  if (isError) indicator.classList.add('drag-error-indicator');
  indicator.textContent = message;
  document.body.appendChild(indicator);
  
  // Auto-remove after 3 seconds
  setTimeout(() => {
    if (indicator.parentNode) indicator.remove();
  }, 3000);
}

function createDragBackup() {
  dragBackupState = {
    events: JSON.parse(JSON.stringify(events)),
    timestamp: Date.now()
  };
  console.log('Drag backup created with', events.length, 'events');
}

function restoreDragBackup() {
  if (!dragBackupState) {
    console.error('No drag backup available!');
    return false;
  }
  
  events = dragBackupState.events;
  saveLocalEvents();
  render();
  console.log('Restored from drag backup - recovered', events.length, 'events');
  return true;
}

function setupDrag(el){
  el.addEventListener('dragstart',e=>{ 
    if (dragInProgress) {
      e.preventDefault();
      console.warn('Drag already in progress - preventing new drag');
      return;
    }
    
    const ev=events.find(x=>x.id===el.dataset.id); 
    if(!ev) {
      console.error('Event not found for drag:', el.dataset.id);
      e.preventDefault();
      return;
    }
    
    // Create backup before starting drag
    createDragBackup();
    dragInProgress = true;
    showDragIndicator('🛡️ Backup created - drag safely!');
    
    e.dataTransfer.setData('text/plain', JSON.stringify({id:ev.id, originalDate: ev.date})); 
    el.classList.add('dragging'); 
    console.log('Drag started for event:', ev.text, 'from date:', ev.date);
  });
  
  el.addEventListener('dragend',()=>{
    el.classList.remove('dragging');
    setTimeout(() => {
      dragInProgress = false;
      console.log('Drag ended - system ready for next operation');
    }, 100);
  });
}
function setupDayDropZone(dayCell){
  dayCell.addEventListener('dragover',e=>{e.preventDefault(); dayCell.classList.add('drag-over');});
  dayCell.addEventListener('dragleave',e=>{ if(!dayCell.contains(e.relatedTarget)) dayCell.classList.remove('drag-over'); });
  dayCell.addEventListener('drop',e=>{ 
    e.preventDefault(); 
    dayCell.classList.remove('drag-over'); 
    
    if (!dragInProgress) {
      console.warn('Drop detected but no drag in progress');
      return;
    }
    
    const data=e.dataTransfer.getData('text/plain'); 
    if(!data) {
      console.warn('No drag data received');
      return;
    }
    
    try { 
      const {id, originalDate}=JSON.parse(data); 
      const targetDate = dayCell.dataset.date;
      console.log('Drop attempt - moving event', id, 'from', originalDate, 'to', targetDate);
      
      if (safeMoveEvent(id, targetDate, originalDate)) {
        console.log('✅ Event moved successfully');
        showDragIndicator('✅ Event moved successfully!');
      } else {
        console.error('❌ Event move failed - backup may have been restored');
        showDragIndicator('❌ Move failed - restored backup', true);
      }
    } catch(err){ 
      console.error('Drop parse error:', err);
      showDragIndicator('❌ Drop error - restored backup', true);
      restoreDragBackup();
    }
  });
}

function safeMoveEvent(id, newDate, originalDate) {
  // Pre-flight checks
  if (!id || !newDate || !originalDate) {
    console.error('Missing required parameters for move:', {id, newDate, originalDate});
    restoreDragBackup();
    return false;
  }
  
  // Validate date format
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
    console.error('Invalid date format:', newDate);
    restoreDragBackup();
    return false;
  }
  
  // Find the event
  const ev = events.find(e => e.id === id);
  if (!ev) {
    console.error('Event not found:', id);
    restoreDragBackup();
    return false;
  }
  
  // Safety checks
  if (ev.date === newDate) {
    console.log('Event already on target date - no move needed');
    return true; // Not an error
  }
  
  // Confirm the original date matches (sanity check)
  if (ev.date !== originalDate) {
    console.warn('Event date changed during drag operation. Expected:', originalDate, 'Found:', ev.date);
    // Continue anyway - this might be OK
  }
  
  // Store the old date for rollback
  const oldDate = ev.date;
  
  try {
    // Update the event
    ev.date = newDate;
    console.log('Updated event date in memory');
    
    // Save locally first
    saveLocalEvents(); // Only saves locally if cloud unavailable
    console.log('Updated local backup (if needed)');
    
    // Update the UI
    render();
    console.log('UI updated');
    
    // Update database if available (async - don't wait for it)
    if (supabase) {
      console.log('☁️ Updating cloud database...');
      supabase.from('calendar_events').update({ 
        event_date: newDate, 
        year: parseInt(newDate.slice(0,4),10), 
        month: parseInt(newDate.slice(5,7),10)-1, 
        day: parseInt(newDate.slice(8,10),10) 
      })
      .eq('event_date', oldDate)
      .eq('event_text', ev.text)
      .eq('event_class', ev.class)
      .then(result => {
        console.log('✅ Cloud database updated successfully:', result);
      })
      .catch(dbError => {
        console.error('❌ Cloud update failed:', dbError);
      });
    } else {
      console.warn('☁️ Cloud unavailable - move saved locally only');
    }
    
    return true;
    
  } catch (error) {
    console.error('Error during move operation:', error);
    
    // Restore from backup
    if (restoreDragBackup()) {
      console.log('Successfully restored from backup after error');
    } else {
      console.error('Failed to restore backup - manual recovery needed');
    }
    
    return false;
  }
}

// Emergency recovery function - call from browser console if needed
window.emergencyRestoreCalendar = function() {
  if (restoreDragBackup()) {
    alert('Calendar restored from backup!');
    return true;
  } else {
    alert('No backup available - try refreshing the page');
    return false;
  }
};
