        // API helper function
        async function codaAPI(endpoint, method = 'GET', body = null) {
            const url = `https://coda.io/apis/v1/docs/${CODA_DOC_ID}${endpoint}`;
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${CODA_API_TOKEN}`,
                    'Content-Type': 'application/json'
                }
            };
            if (body) options.body = JSON.stringify(body);

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${data.message || 'API Error'}`);
                }
                return data;
            } catch (error) {
                console.error('Coda API Error:', error);
                throw error;
            }
        }

        // Show message function
        function showMessage(text, type = 'info') {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = text;
            messages.appendChild(div);
            
            // Auto-remove after 10 seconds for success messages
            if (type === 'success') {
                setTimeout(() => {
                    if (div.parentNode) {
                        div.parentNode.removeChild(div);
                    }
                }, 10000);
            }
        }

        // Update progress bar
        function updateProgress(current, total) {
            const progressElement = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            const percentage = Math.round((current / total) * 100);
            
            progressElement.style.display = 'block';
            progressBar.style.width = `${percentage}%`;
            progressBar.textContent = `${percentage}% (${current}/${total})`;
        }

        // Extract cards (already defined above)
        function extractCards() {
            extractedCards = hamiltonCards;
            showMessage(`✅ Extracted ${extractedCards.length} Hamilton task cards!`, 'success');
            document.getElementById('previewBtn').disabled = false;
            return extractedCards;
        }

        // Preview cards
        function previewCards() {
            const cardList = document.getElementById('cardList');
            const cardPreview = document.getElementById('cardPreview');
            
            cardList.innerHTML = '';
            
            extractedCards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card-preview';
                div.innerHTML = `
                    <h4>${card.cardNumber} - ${card.title} (${card.difficulty})</h4>
                    <small>${card.instructions.substring(0, 100)}${card.instructions.length > 100 ? '...' : ''}</small>
                `;
                cardList.appendChild(div);
            });
            
            cardPreview.style.display = 'block';
            document.getElementById('uploadBtn').disabled = false;
            showMessage(`📋 Preview generated for ${extractedCards.length} cards. Ready to upload!`, 'info');
        }

        // Clear existing cards
        async function clearExistingCards() {
            try {
                showMessage('🗑️ Clearing existing cards from table...', 'info');
                
                // Get all existing rows
                const data = await codaAPI(`/tables/${TABLE_ID}/rows`);
                const existingRows = data.items || [];
                
                if (existingRows.length === 0) {
                    showMessage('ℹ️ No existing cards found to clear.', 'info');
                    return;
                }
                
                // Delete all rows
                for (let i = 0; i < existingRows.length; i++) {
                    await codaAPI(`/tables/${TABLE_ID}/rows/${existingRows[i].id}`, 'DELETE');
                    updateProgress(i + 1, existingRows.length);
                }
                
                showMessage(`✅ Cleared ${existingRows.length} existing cards from the table!`, 'success');
                document.getElementById('progress').style.display = 'none';
                
            } catch (error) {
                showMessage(`❌ Error clearing existing cards: ${error.message}`, 'error');
            }
        }

        // Upload cards to Coda
        async function uploadCards() {
            try {
                showMessage('🚀 Adding cards to Coda table...', 'info');
                
                const rows = extractedCards.map(card => {
                    const cells = {};
                    Object.keys(COLUMN_MAPPING).forEach(key => {
                        if (card[key] !== undefined) {
                            cells[COLUMN_MAPPING[key]] = card[key];
                        }
                    });
                    return { cells };
                });

                // Add cards in batches to avoid API limits
                const batchSize = 5;
                let added = 0;
                
                for (let i = 0; i < rows.length; i += batchSize) {
                    const batch = rows.slice(i, i + batchSize);
                    await codaAPI(`/tables/${TABLE_ID}/rows`, 'POST', { rows: batch });
                    added += batch.length;
                    updateProgress(added, rows.length);
                    
                    // Small delay between batches
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                showMessage(`🎉 Successfully added ${extractedCards.length} Hamilton task cards to your Coda table!`, 'success');
                showMessage(`🔗 You can now visit your task cards page to see them load dynamically from Coda!`, 'info');
                document.getElementById('progress').style.display = 'none';
                
            } catch (error) {
                showMessage(`❌ Error uploading cards: ${error.message}`, 'error');
            }
        }

        // Event listeners
        document.getElementById('extractBtn').addEventListener('click', extractCards);
        document.getElementById('previewBtn').addEventListener('click', previewCards);
        document.getElementById('uploadBtn').addEventListener('click', uploadCards);
        document.getElementById('clearBtn').addEventListener('click', clearExistingCards);

        // Initial message
        showMessage('👋 Ready to extract and upload your Hamilton task cards!', 'info');
    </script>
</body>
