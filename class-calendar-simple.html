<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHS Class Calendar - Simple</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=HarmonyOS+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'HarmonyOS Sans', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        
        .header {
            background-color: #2d2d2d;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #444;
        }
        
        .header h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            margin: 0;
            color: #fff;
        }
        
        .calendar-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            gap: 1px;
            background-color: #444;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .day-header {
            background-color: #3d3d3d;
            color: #fff;
            font-weight: bold;
            text-align: center;
            padding: 15px 5px;
            font-size: 0.9rem;
        }
        
        .week-label {
            background-color: #2d2d2d;
            color: #ccc;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.8rem;
            min-height: 120px;
        }
        
        .day-cell {
            background-color: #2a2a2a;
            min-height: 120px;
            padding: 8px;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .day-cell:hover {
            background-color: #333;
        }
        
        .day-cell.other-month {
            background-color: #1f1f1f;
            color: #666;
        }
        
        .day-cell.current-day {
            background-color: #4a4a4a;
            border: 2px solid #666;
        }
        
        .day-number {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .current-week {
            background-color: #3a3a3a !important;
        }
        
        .debug-info {
            background-color: #2d2d2d;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>DHS Class Calendar - Simple Version</h1>
    </div>
    
    <div class="calendar-container">
        <div class="debug-info">
            <h3>Status: <span id="status">Initializing...</span></h3>
            <div id="debugLog">Starting up...</div>
        </div>
        
        <div class="calendar-grid" id="calendarGrid">
            <div style="background: #444; color: white; padding: 20px; grid-column: 1 / -1; text-align: center;">
                Calendar loading...
            </div>
        </div>
    </div>

    <script>
        // Simple logging
        function debugLog(message) {
            const log = document.getElementById('debugLog');
            log.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + message;
            console.log(message);
        }
        
        function setStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        // Month and day names
        const monthNames = ["January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        
        // Get current week bounds (Monday-based)
        function getCurrentWeekBounds() {
            const today = new Date();
            const currentDayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, etc.
            const mondayBasedDayOfWeek = currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1;
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - mondayBasedDayOfWeek);
            return startOfWeek;
        }
        
        // Generate 7 weeks of calendar data
        function generateWeeks() {
            debugLog('Generating 7 weeks of calendar data...');
            const weeks = [];
            const startDate = getCurrentWeekBounds();
            
            for (let weekIndex = 0; weekIndex < 7; weekIndex++) {
                const week = [];
                for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + (weekIndex * 7) + dayIndex);
                    
                    week.push({
                        date: date,
                        dayNumber: date.getDate(),
                        isCurrentWeek: weekIndex === 0,
                        isToday: date.toDateString() === new Date().toDateString(),
                        isCurrentMonth: date.getMonth() === new Date().getMonth()
                    });
                }
                weeks.push(week);
            }
            
            debugLog(`Generated ${weeks.length} weeks successfully`);
            return weeks;
        }
        
        // Generate the calendar
        function generateCalendar() {
            debugLog('Starting calendar generation...');
            setStatus('Generating calendar...');
            
            const calendarGrid = document.getElementById('calendarGrid');
            if (!calendarGrid) {
                debugLog('ERROR: Calendar grid not found');
                setStatus('ERROR: Calendar grid not found');
                return;
            }
            
            // Clear existing content
            calendarGrid.innerHTML = '';
            
            // Empty corner cell
            const corner = document.createElement('div');
            corner.className = 'day-header';
            corner.textContent = '';
            calendarGrid.appendChild(corner);
            
            // Add day headers
            dayNames.forEach(dayName => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = dayName.substring(0, 3);
                calendarGrid.appendChild(header);
            });
            
            // Generate weeks
            const weeks = generateWeeks();
            weeks.forEach((week, weekIndex) => {
                // Add week label
                const weekLabel = document.createElement('div');
                weekLabel.className = 'week-label';
                if (week[0].isCurrentWeek) {
                    weekLabel.classList.add('current-week');
                }
                
                const weekStart = week[0].date;
                const weekEnd = week[6].date;
                const weekText = `Week ${weekIndex + 1}`;
                weekLabel.textContent = weekText;
                
                calendarGrid.appendChild(weekLabel);
                
                // Add day cells
                week.forEach(dayData => {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    
                    if (!dayData.isCurrentMonth) {
                        dayCell.classList.add('other-month');
                    }
                    if (dayData.isToday) {
                        dayCell.classList.add('current-day');
                    }
                    
                    const dayNumber = document.createElement('div');
                    dayNumber.className = 'day-number';
                    dayNumber.textContent = dayData.dayNumber;
                    
                    dayCell.appendChild(dayNumber);
                    calendarGrid.appendChild(dayCell);
                });
            });
            
            debugLog('Calendar generation completed!');
            setStatus('Calendar ready');
        }
        
        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('DOM loaded, starting initialization...');
            setStatus('DOM loaded');
            
            setTimeout(() => {
                try {
                    generateCalendar();
                } catch (error) {
                    debugLog('ERROR: ' + error.message);
                    setStatus('ERROR: ' + error.message);
                }
            }, 100);
        });
        
        debugLog('Script loaded successfully');
    </script>
</body>
</html>
