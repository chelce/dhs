<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cards - All Subjects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=HarmonyOS+Sans:opsz,wght@8..48,300;8..48,400;8..48,500;8..48,600;8..48,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            /* Base font sizes for consistent scaling */
            --base-font-size: 14px;
            --base-line-height: 1.4;
            --title-size: 1.2em;
            --difficulty-size: 0.8em;
            --card-number-size: 1.1em;
            --subject-tag-size: 8px;
            
            /* Default layout values */
            --cards-per-row: 3;
            --card-gap: 40px;
            --card-font-scale: 1;
            --card-margin: 20px;
        }
        
        body {
            font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: white; /* Pure white background for printing */
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            /* Removed shadow for cleaner appearance */
            position: relative;
        }

        .header h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-family: 'Bebas Neue', cursive;
            font-size: 32px;
            letter-spacing: 1.5px;
        }

        /* Collapsible Controls */
        .controls-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .controls-toggle:hover {
            background: #f8f9fa;
            border-color: #999;
        }

        .controls-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            /* Removed shadow for cleaner interface */
            z-index: 999;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 80px 20px 20px;
            border-left: 1px solid #ddd;
        }

        .controls-drawer.open {
            right: 0;
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-row label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            min-width: 120px;
        }

        .control-row input, .control-row select {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .control-row input[type="range"] {
            flex: 1;
        }

        .range-display {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #007bff;
        }

        /* Print Layout Controls */
        .layout-preview {
            display: grid;
            gap: 2px;
            margin: 10px 0;
            max-width: 100px;
        }

        .layout-preview .preview-card {
            background: #007bff;
            border-radius: 2px;
            height: 15px;
        }

        /* Card Selection */
        .selection-actions {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .selection-actions button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .selection-actions button:hover {
            background: #e9ecef;
        }

        .selection-counter {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .filter-group select, .filter-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .stats {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--cards-per-row, 3), 1fr);
            gap: var(--card-gap, 40px);
            margin-top: 20px;
            padding-right: 60px; /* Extra padding to prevent cutoff */
        }

        /* Hamilton-style task card design */
        .task-card {
            border: 2px solid;
            border-radius: 8px;
            padding: 15px;
            background: white;
            width: 100%;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin-bottom: var(--card-margin, 20px);
            cursor: pointer;
            transition: all 0.2s ease;
            /* Apply font scaling to entire card */
            font-size: calc(var(--base-font-size, 14px) * var(--card-font-scale, 1));
            line-height: calc(var(--base-line-height, 1.4) * var(--card-font-scale, 1));
        }

        .task-card.selected {
            border-width: 4px;
            border-style: dashed;
            transform: scale(1.02);
        }

        /* Selection mode styling */
        .selection-mode .task-card {
            cursor: pointer;
        }
        
        .selection-mode .task-card:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .selection-mode-toggle {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
            font-size: 14px;
        }

        .selection-mode-toggle.active {
            background: #dc3545;
        }

        .selection-mode-toggle:hover {
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--cards-per-row, 3), 1fr);
            gap: var(--card-gap, 40px);
            margin-top: 20px;
        }

        /* Apply comprehensive font scaling to ALL card elements */
        .task-card,
        .task-card * {
            font-size: inherit;
        }

        .task-card {
            font-size: calc(1em * var(--card-font-scale, 1));
        }

        .task-card .card-title {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(24px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1.5px;
            flex-grow: 1;
        }

        .task-card .instructions {
            font-size: calc(12px * var(--card-font-scale, 1)) !important;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-card .directions h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .task-card .directions ol {
            margin-left: 18px;
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
        }

        .task-card .directions li {
            margin-bottom: 4px;
            line-height: 1.4;
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
        }

        .task-card .sentence-frame h3,
        .task-card .hints h3,
        .task-card .full-width-hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .task-card .sentence-frame p {
            font-style: italic;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .hints ul,
        .task-card .full-width-hints ul {
            margin-left: 15px;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .hints li,
        .task-card .full-width-hints li {
            margin-bottom: 3px;
            line-height: 1.3;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1)) !important;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }

        .task-card .difficulty-label {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .task-card .subject-tag {
            position: absolute;
            bottom: 5px;
            left: 15px;
            background: white;
            color: #666;
            font-size: calc(9px * var(--card-font-scale, 1)) !important;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #ddd;
            font-weight: 400;
        }

        :root {
            --cards-per-row: 3;
            --card-gap: 40px;
            --card-margin: 20px;
            --card-font-scale: 1;
        }

        .task-card .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Bebas Neue', cursive;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }

        .task-card .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .task-card .card-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            flex-grow: 1;
        }

        .task-card .card-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .task-card .difficulty-label {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(11px * var(--card-font-scale, 1));
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: 5px;
        }

        .task-card .instructions {
            font-size: calc(12px * var(--card-font-scale, 1));
            font-weight: 600;
            margin-bottom: 15px;
            line-height: calc(1.5 * var(--card-font-scale, 1));
        }

        .task-card .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .task-card .directions {
            margin-bottom: 15px;
        }

        .task-card .directions h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .directions ol {
            margin-left: 18px;
            font-size: 11px;
        }

        .task-card .directions li {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .task-card .bottom-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }

        .task-card .sentence-frame {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
            font-style: italic;
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .sentence-frame h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            font-style: normal;
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .hints {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
        }

        .task-card .hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .hints ul {
            margin-left: 15px;
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .hints li {
            margin-bottom: calc(3px * var(--card-font-scale, 1));
            line-height: calc(1.3 * var(--card-font-scale, 1));
        }

        .task-card .full-width-hints {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
            margin-top: auto;
            grid-column: 1 / -1;
        }

        .task-card .full-width-hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .full-width-hints ul {
            margin-left: 15px;
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .full-width-hints li {
            margin-bottom: calc(3px * var(--card-font-scale, 1));
            line-height: calc(1.3 * var(--card-font-scale, 1));
        }

        .task-card .subject-tag {
            position: absolute;
            bottom: 10px;
            left: 15px;
            background: transparent;
            color: #999;
            font-size: 8px;
            padding: 0;
            border: none;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        /* Easy Level Colors - Green */
        .task-card.easy {
            border-color: #28a745;
        }
        
        .task-card.easy .card-header {
            border-color: #28a745;
        }
        
        .task-card.easy .card-title,
        .task-card.easy .card-icon,
        .task-card.easy .difficulty-label,
        .task-card.easy .card-number,
        .task-card.easy .directions h3,
        .task-card.easy .sentence-frame h3,
        .task-card.easy .hints h3,
        .task-card.easy .full-width-hints h3 {
            color: #28a745;
        }

        /* Medium Level Colors - Orange */
        .task-card.medium {
            border-color: #fd7e14;
        }
        
        .task-card.medium .card-header {
            border-color: #fd7e14;
        }
        
        .task-card.medium .card-title,
        .task-card.medium .card-icon,
        .task-card.medium .difficulty-label,
        .task-card.medium .card-number,
        .task-card.medium .directions h3,
        .task-card.medium .sentence-frame h3,
        .task-card.medium .hints h3,
        .task-card.medium .full-width-hints h3 {
            color: #fd7e14;
        }

        /* Hard Level Colors - Red */
        .task-card.hard {
            border-color: #dc3545;
        }
        
        .task-card.hard .card-header {
            border-color: #dc3545;
        }
        
        .task-card.hard .card-title,
        .task-card.hard .card-icon,
        .task-card.hard .difficulty-label,
        .task-card.hard .card-number,
        .task-card.hard .directions h3,
        .task-card.hard .sentence-frame h3,
        .task-card.hard .hints h3,
        .task-card.hard .full-width-hints h3 {
            color: #dc3545;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .no-cards {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 8px;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .header {
                display: none;
            }
            
            .controls-toggle,
            .controls-drawer {
                display: none !important;
            }
            
            .cards-grid {
                display: grid;
                grid-template-columns: repeat(var(--cards-per-row, 2), 1fr) !important;
                gap: var(--card-gap, 20px) !important;
                margin: 0;
                padding: 0;
                page-break-before: avoid;
            }
            
            .task-card {
                box-shadow: none;
                border: 2px solid #333;
                page-break-inside: avoid;
                break-inside: avoid;
                margin: 0;
                margin-bottom: var(--card-margin, 10px);
                background: white !important;
                transform: none !important; /* Remove any hover/selection effects */
            }

            .task-card .card-checkbox {
                display: none;
            }

            .loading,
            .error,
            .no-cards {
                display: none;
            }

            /* Comprehensive font scaling for all text elements in print */
            .task-card,
            .task-card *,
            .task-card .card-title,
            .task-card .instructions,
            .task-card .directions h3,
            .task-card .directions p,
            .task-card .directions ul,
            .task-card .directions li,
            .task-card .hints h3,
            .task-card .hints ul,
            .task-card .hints li,
            .task-card .sentence-frame h3,
            .task-card .sentence-frame p,
            .task-card .difficulty-label {
                font-size: calc(var(--base-font-size, 1em) * var(--card-font-scale, 1)) !important;
                color: black !important;
                line-height: calc(var(--base-line-height, 1.4) * var(--card-font-scale, 1)) !important;
            }
            
            /* Scale specific elements proportionally */
            .task-card .card-title {
                font-size: calc(var(--title-size, 1.2em) * var(--card-font-scale, 1)) !important;
            }
            
            .task-card .difficulty-label {
                font-size: calc(var(--difficulty-size, 0.8em) * var(--card-font-scale, 1)) !important;
            }
            
            .task-card .card-number {
                font-size: calc(var(--card-number-size, 1.1em) * var(--card-font-scale, 1)) !important;
            }

            .task-card .subject-tag {
                font-size: calc(var(--subject-tag-size, 8px) * var(--card-font-scale, 1)) !important;
            }
            
            /* Remove selection highlighting in print */
            .task-card.selected {
                border-style: solid !important;
                border-width: 2px !important;
                transform: none !important;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filters {
                grid-template-columns: 1fr;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .task-card .bottom-sections {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <!-- Controls Toggle Button -->
    <button class="controls-toggle" id="controlsToggle" title="Toggle Controls">
        <i data-lucide="settings"></i>
    </button>

    <!-- Controls Drawer -->
    <div class="controls-drawer" id="controlsDrawer">
        <div class="control-section">
            <h3>Filters</h3>
            <div class="control-group">
                <div class="control-row">
                    <label for="subjectFilter">Subject:</label>
                    <select id="subjectFilter">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                
                <div class="control-row">
                    <label for="unitFilter">Unit:</label>
                    <select id="unitFilter">
                        <option value="">All Units</option>
                    </select>
                </div>
                
                <div class="control-row">
                    <label for="seriesFilter">Series:</label>
                    <select id="seriesFilter">
                        <option value="">All Series</option>
                    </select>
                </div>
                
                <div class="control-row">
                    <label for="difficultyFilter">Difficulty:</label>
                    <select id="difficultyFilter">
                        <option value="">All Levels</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                
                <div class="control-row">
                    <label for="searchFilter">Search:</label>
                    <input type="text" id="searchFilter" placeholder="Search titles, instructions...">
                </div>
            </div>
        </div>

        <div class="control-section">
            <h3>Card Selection</h3>
            <div class="control-group">
                <button class="selection-mode-toggle" id="selectionModeToggle" onclick="toggleSelectionMode()">
                    Enable Multi-Select Mode
                </button>
                <div class="control-row">
                    <label>
                        <input type="checkbox" id="showOnlySelected"> Show Only Selected
                    </label>
                </div>
                <div class="selection-actions">
                    <button onclick="selectAll()">Select All</button>
                    <button onclick="selectNone()">Select None</button>
                    <button onclick="selectVisible()">Select Visible</button>
                </div>
                <div class="selection-counter" id="selectionCounter">
                    0 cards selected
                </div>
            </div>
        </div>

        <div class="control-section">
            <h3>Print Layout</h3>
            <div class="control-group">
                <div class="control-row">
                    <label for="cardsPerRow">Cards per Row:</label>
                    <input type="range" id="cardsPerRow" min="1" max="6" value="3">
                    <span class="range-display" id="cardsPerRowDisplay">3</span>
                </div>
                
                <div class="control-row">
                    <label for="cardGap">Card Spacing:</label>
                    <input type="range" id="cardGap" min="30" max="120" value="40">
                    <span class="range-display" id="cardGapDisplay">40px</span>
                </div>
                
                <div class="control-row">
                    <label for="cardFontScale">Text Size:</label>
                    <input type="range" id="cardFontScale" min="0.5" max="2" step="0.1" value="1">
                    <span class="range-display" id="cardFontScaleDisplay">100%</span>
                </div>

                <div class="layout-preview" id="layoutPreview">
                    <!-- Preview grid will be generated here -->
                </div>
            </div>
        </div>

        <div class="control-section">
            <h3>Stats</h3>
            <div class="stats" id="stats">
                Loading cards...
            </div>
        </div>
    </div>

    <div id="loadingMessage" class="loading">
        🔄 Loading task cards from database...
    </div>

    <div id="errorMessage" class="error" style="display: none;">
        ❌ Failed to load task cards. Please try refreshing the page.
    </div>

    <div id="noCards" class="no-cards" style="display: none;">
        📋 No cards match your current filters. Try adjusting your selection.
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- Cards will be loaded here dynamically -->
    </div>

    <script>
        // Configuration - now with series support
        const CODA_CONFIG = {
            docId: 'xmloQUGg-g',
            apiToken: '3f19aabb-ed6a-4bb1-9dc6-5cb058fcd94c',
            tableId: 'grid-MbORljz5rl',
            columns: {
                cardNumber: 'c-oCblzlJHpK',
                difficulty: 'c-R3MiGsbDIh',
                title: 'c-AaNuPckhD2',
                icon: 'c-ic9sO6dOFA',
                instructions: 'c-5Wm1KWBumn',
                directions: 'c-UdatLRw4ZE',
                sentenceFrame: 'c-PTc-M6N93s',
                hints: 'c-J2p_hAW8aK',
                subject: 'c-PvCf__AtLS', // Correct subject column ID
                unit: 'c-VMuDoulorO',     // Correct unit column ID
                series: 'c-OBxHtN8XaH' // Series column for specific sets
            }
        };

        let allCards = [];
        let filteredCards = [];

        // Load task cards from Coda
        async function loadTaskCards() {
            try {
                console.log('🔄 Loading task cards from Coda...');
                console.log('📋 Config:', CODA_CONFIG);
                
                // Add timeout to prevent hanging
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(`https://coda.io/apis/v1/docs/${CODA_CONFIG.docId}/tables/${CODA_CONFIG.tableId}/rows`, {
                    headers: {
                        'Authorization': `Bearer ${CODA_CONFIG.apiToken}`,
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ HTTP Error details:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('✅ Raw data from Coda:', data);
                console.log('✅ Loaded', data.items?.length || 0, 'task cards from Coda');
                
                if (!data.items || data.items.length === 0) {
                    throw new Error('No task cards found in the database');
                }
                
                allCards = data.items.map(item => {
                    const values = item.values;
                    return {
                        id: item.id,
                        cardNumber: values[CODA_CONFIG.columns.cardNumber] || '',
                        difficulty: values[CODA_CONFIG.columns.difficulty] || 'Easy',
                        title: values[CODA_CONFIG.columns.title] || 'Untitled Card',
                        icon: values[CODA_CONFIG.columns.icon] || 'help-circle',
                        instructions: values[CODA_CONFIG.columns.instructions] || '',
                        directions: values[CODA_CONFIG.columns.directions] || '',
                        sentenceFrame: values[CODA_CONFIG.columns.sentenceFrame] || '',
                        hints: values[CODA_CONFIG.columns.hints] || '',
                        subject: values[CODA_CONFIG.columns.subject] || 'Unknown',
                        unit: values[CODA_CONFIG.columns.unit] || 'Unknown',
                        series: values[CODA_CONFIG.columns.series] || 'Unknown'
                    };
                });

                // Sort cards: Series together, then Easy→Medium→Hard, then sequential within each
                allCards.sort((a, b) => {
                    // First sort by series
                    if (a.series !== b.series) {
                        return a.series.localeCompare(b.series);
                    }
                    
                    // Then sort by difficulty (Easy, Medium, Hard)
                    const difficultyOrder = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
                    const aDiff = difficultyOrder[a.difficulty] || 999;
                    const bDiff = difficultyOrder[b.difficulty] || 999;
                    
                    if (aDiff !== bDiff) {
                        return aDiff - bDiff;
                    }
                    
                    // Finally sort by card number (sequential within difficulty)
                    const aNum = parseInt(a.cardNumber) || 0;
                    const bNum = parseInt(b.cardNumber) || 0;
                    return aNum - bNum;
                });
                
                populateFilterOptions();
                applyFilters();
                document.getElementById('loadingMessage').style.display = 'none';
                
            } catch (error) {
                console.error('❌ Failed to load task cards:', error);
                
                let errorMessage = 'Failed to load task cards. ';
                if (error.name === 'AbortError') {
                    errorMessage += 'Request timed out after 30 seconds.';
                } else if (error.message.includes('CORS')) {
                    errorMessage += 'Cross-origin request blocked. Try accessing the page from the GitHub Pages URL.';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage += 'Network error. Check your internet connection.';
                } else {
                    errorMessage += error.message;
                }
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').innerHTML = `❌ ${errorMessage}`;
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // Populate filter dropdown options
        function populateFilterOptions() {
            const subjects = [...new Set(allCards.map(card => card.subject))].sort();
            const units = [...new Set(allCards.map(card => card.unit))].sort();
            const series = [...new Set(allCards.map(card => card.series))].sort();
            
            const subjectSelect = document.getElementById('subjectFilter');
            const unitSelect = document.getElementById('unitFilter');
            const seriesSelect = document.getElementById('seriesFilter');
            
            // Clear existing options (except first "All" option)
            [subjectSelect, unitSelect, seriesSelect].forEach(select => {
                while (select.children.length > 1) {
                    select.removeChild(select.lastChild);
                }
            });
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });
            
            units.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });
            
            series.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s;
                seriesSelect.appendChild(option);
            });
        }

        // Apply filters
        function applyFilters() {
            const subjectFilter = document.getElementById('subjectFilter').value;
            const unitFilter = document.getElementById('unitFilter').value;
            const seriesFilter = document.getElementById('seriesFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const showOnlySelected = document.getElementById('showOnlySelected')?.checked;

            filteredCards = allCards.filter(card => {
                if (subjectFilter && card.subject !== subjectFilter) return false;
                if (unitFilter && card.unit !== unitFilter) return false;
                if (seriesFilter && card.series !== seriesFilter) return false;
                if (difficultyFilter && card.difficulty !== difficultyFilter) return false;
                if (searchFilter) {
                    const searchText = `${card.title} ${card.instructions}`.toLowerCase();
                    if (!searchText.includes(searchFilter)) return false;
                }
                
                // Apply selection filter if enabled
                if (showOnlySelected && selectedCards && selectedCards.size > 0) {
                    const cardId = `card-${card.cardNumber}-${card.series}`;
                    if (!selectedCards.has(cardId)) return false;
                }
                
                return true;
            });

            renderCards();
            updateStats();
        }

        // Render cards
        function renderCards() {
            const cardsGrid = document.getElementById('cardsGrid');
            const noCards = document.getElementById('noCards');
            
            if (filteredCards.length === 0) {
                cardsGrid.innerHTML = '';
                noCards.style.display = 'block';
                return;
            }
            
            noCards.style.display = 'none';
            cardsGrid.innerHTML = filteredCards.map(createTaskCardHtml).join('');
            
            // Initialize Lucide icons
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // Create HTML for a single task card
        function createTaskCardHtml(card) {
            const difficultyClass = card.difficulty.toLowerCase();
            const directionsHtml = formatDirections(card.directions);
            const hintsHtml = formatHints(card.hints);
            const cardId = `card-${card.cardNumber}-${card.series}`;
            
            // Check if this is a full-width hints layout (Medium/Hard without sentence frames)
            const hasFullWidthHints = !card.sentenceFrame && (card.difficulty === 'Medium' || card.difficulty === 'Hard');

            return `
                <div class="task-card ${difficultyClass}" data-card-id="${cardId}" onclick="handleCardClick(this)">
                    <div class="card-number">${card.cardNumber}</div>
                    <div class="subject-tag">${card.subject} - ${card.unit} - ${card.series}</div>
                    
                    <div class="card-header">
                        <i data-lucide="${card.icon}" class="card-icon"></i>
                        <div class="card-title">${card.title}</div>
                    </div>
                    
                    <div class="difficulty-label">${card.difficulty.toUpperCase()} LEVEL</div>
                    
                    <div class="card-content">
                        <div class="instructions">
                            ${card.instructions}
                        </div>
                        
                        <div class="directions">
                            <h3>Directions:</h3>
                            ${directionsHtml}
                        </div>

                        <div class="bottom-sections">
                            ${card.sentenceFrame ? `
                                <div class="sentence-frame">
                                    <h3>Sentence Frame:</h3>
                                    <p>${card.sentenceFrame}</p>
                                </div>
                                <div class="hints">
                                    <h3>Helpful Hints:</h3>
                                    ${hintsHtml}
                                </div>
                            ` : `
                                <div class="full-width-hints">
                                    <h3>Helpful Hints:</h3>
                                    ${hintsHtml}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // Format directions text
        function formatDirections(directions) {
            if (!directions) return '<ol><li>No directions provided</li></ol>';
            
            // If it contains newlines, treat as separate list items
            if (directions.includes('\n')) {
                const items = directions.split('\n').map((item, index) => {
                    const cleaned = item.replace(/^\d+\.?\s*/, '').trim(); // Remove existing numbers
                    return cleaned ? `<li>${cleaned}</li>` : '';
                }).filter(item => item);
                
                return `<ol>${items.join('')}</ol>`;
            }
            
            return `<ol><li>${directions}</li></ol>`;
        }

        // Format hints text
        function formatHints(hints) {
            if (!hints) return '<ul><li>No hints provided</li></ul>';
            
            // If it contains newlines, treat as separate list items
            if (hints.includes('\n')) {
                const items = hints.split('\n').map(item => {
                    const cleaned = item.replace(/^[-*•]\s*/, '').trim(); // Remove bullet points
                    return cleaned ? `<li>${cleaned}</li>` : '';
                }).filter(item => item);
                
                return `<ul>${items.join('')}</ul>`;
            }
            
            return `<ul><li>${hints}</li></ul>`;
        }

        // Update stats
        function updateStats() {
            const stats = document.getElementById('stats');
            const total = allCards.length;
            const filtered = filteredCards.length;
            const difficulties = filteredCards.reduce((acc, card) => {
                acc[card.difficulty] = (acc[card.difficulty] || 0) + 1;
                return acc;
            }, {});

            stats.innerHTML = `
                Showing ${filtered} of ${total} cards | 
                Easy: ${difficulties.Easy || 0} | 
                Medium: ${difficulties.Medium || 0} | 
                Hard: ${difficulties.Hard || 0}
            `;
        }

        // Controls drawer functionality
        function toggleControlsDrawer() {
            const drawer = document.getElementById('controlsDrawer');
            const toggle = document.getElementById('controlsToggle');
            drawer.classList.toggle('open');
            
            // Update toggle icon
            const icon = toggle.querySelector('i');
            if (drawer.classList.contains('open')) {
                icon.setAttribute('data-lucide', 'x');
            } else {
                icon.setAttribute('data-lucide', 'settings');
            }
            window.lucide.createIcons();
        }

        // Print layout controls
        function updatePrintLayout() {
            const cardsPerRow = document.getElementById('cardsPerRow').value;
            const cardGap = document.getElementById('cardGap').value;
            const cardFontScale = document.getElementById('cardFontScale').value;
            
            // Update CSS custom properties
            document.documentElement.style.setProperty('--cards-per-row', cardsPerRow);
            document.documentElement.style.setProperty('--card-gap', cardGap + 'px');
            document.documentElement.style.setProperty('--card-font-scale', cardFontScale);
            
            // Update display values
            document.getElementById('cardsPerRowDisplay').textContent = cardsPerRow;
            document.getElementById('cardGapDisplay').textContent = cardGap + 'px';
            document.getElementById('cardFontScaleDisplay').textContent = Math.round(cardFontScale * 100) + '%';
            
            updateLayoutPreview(cardsPerRow);
        }

        function updateLayoutPreview(cardsPerRow) {
            const preview = document.getElementById('layoutPreview');
            preview.style.gridTemplateColumns = `repeat(${cardsPerRow}, 1fr)`;
            preview.innerHTML = Array.from({length: cardsPerRow * 2}, () => '<div class="preview-card"></div>').join('');
        }

        // Multi-select mode functionality
        let isSelectionMode = false;
        let selectedCards = new Set();
        
        function toggleSelectionMode() {
            isSelectionMode = !isSelectionMode;
            const toggleButton = document.getElementById('selection-mode-toggle');
            const body = document.body;
            
            if (isSelectionMode) {
                toggleButton.textContent = 'Exit Selection Mode';
                toggleButton.style.backgroundColor = '#dc3545';
                body.classList.add('selection-mode');
                selectedCards.clear();
            } else {
                toggleButton.textContent = 'Enter Selection Mode';
                toggleButton.style.backgroundColor = '#28a745';
                body.classList.remove('selection-mode');
                selectedCards.clear();
                // Remove selected class from all cards
                document.querySelectorAll('.task-card.selected').forEach(card => {
                    card.classList.remove('selected');
                });
            }
            updateSelectionCounter();
        }
        
        function handleCardClick(cardElement) {
            if (isSelectionMode) {
                const cardId = cardElement.dataset.cardId;
                
                if (cardElement.classList.contains('selected')) {
                    cardElement.classList.remove('selected');
                    selectedCards.delete(cardId);
                } else {
                    cardElement.classList.add('selected');
                    selectedCards.add(cardId);
                }
                
                updateSelectionCounter();
                
                // Apply show only selected filter if enabled
                if (document.getElementById('showOnlySelected').checked) {
                    applyFilters();
                }
            }
        }

        function updateSelectionCounter() {
            document.getElementById('selectionCounter').textContent = `${selectedCards.size} cards selected`;
        }

        function selectAll() {
            if (!isSelectionMode) {
                // Enter selection mode first
                toggleSelectionMode();
            }
            
            document.querySelectorAll('.task-card:not([style*="display: none"])').forEach(card => {
                const cardId = card.dataset.cardId;
                card.classList.add('selected');
                selectedCards.add(cardId);
            });
            updateSelectionCounter();
        }

        function selectNone() {
            document.querySelectorAll('.task-card.selected').forEach(card => {
                card.classList.remove('selected');
            });
            selectedCards.clear();
            updateSelectionCounter();
        }

        function selectVisible() {
            if (!isSelectionMode) {
                // Enter selection mode first
                toggleSelectionMode();
            }
            
            document.querySelectorAll('.task-card:not([style*="display: none"])').forEach(card => {
                const cardId = card.dataset.cardId;
                card.classList.add('selected');
                selectedCards.add(cardId);
            });
            updateSelectionCounter();
        }
        
        function exportSelected() {
            if (!isSelectionMode || selectedCards.size === 0) {
                alert('Please select cards first by entering selection mode');
                return;
            }
            
            // Get selected card elements
            const selectedElements = Array.from(selectedCards).map(cardId => {
                return document.querySelector(`[data-card-id="${cardId}"]`);
            }).filter(el => el);
            
            if (selectedElements.length === 0) {
                alert('No valid cards selected');
                return;
            }

            const printWindow = window.open('', '_blank');
            const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Selected Task Cards</title>
                    <style>
                        body { 
                            font-family: Arial, sans-serif; 
                            margin: 20px; 
                            background: white;
                            line-height: 1.4;
                        }
                        .task-card { 
                            border: 2px solid #333; 
                            margin: 20px 0; 
                            padding: 20px; 
                            page-break-inside: avoid;
                            background: white;
                        }
                        .card-header { display: flex; align-items: center; margin-bottom: 10px; }
                        .card-icon { margin-right: 10px; }
                        .card-title { font-size: 18px; font-weight: bold; }
                        .difficulty-label { font-weight: bold; margin-bottom: 10px; }
                        .directions, .hints, .sentence-frame { margin: 10px 0; }
                        .directions h3, .hints h3, .sentence-frame h3 { 
                            font-size: 14px; 
                            margin: 5px 0; 
                            color: #333;
                        }
                        .subject-tag { 
                            font-size: 10px; 
                            color: #666; 
                            margin-bottom: 5px;
                        }
                    </style>
                </head>
                <body>
                    ${selectedElements.map(card => card.outerHTML).join('')}
                </body>
                </html>
            `;
            
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
        }

        // Event listeners
        document.getElementById('controlsToggle').addEventListener('click', toggleControlsDrawer);
        document.getElementById('selection-mode-toggle').addEventListener('click', toggleSelectionMode);
        document.getElementById('subjectFilter').addEventListener('change', applyFilters);
        document.getElementById('unitFilter').addEventListener('change', applyFilters);
        document.getElementById('seriesFilter').addEventListener('change', applyFilters);
        document.getElementById('difficultyFilter').addEventListener('change', applyFilters);
        document.getElementById('searchFilter').addEventListener('input', applyFilters);
        document.getElementById('showOnlySelected').addEventListener('change', applyFilters);
        
        // Print layout controls
        document.getElementById('cardsPerRow').addEventListener('input', updatePrintLayout);
        document.getElementById('cardGap').addEventListener('input', updatePrintLayout);
        document.getElementById('cardFontScale').addEventListener('input', updatePrintLayout);

        // Initialize
        loadTaskCards();
        
        // Initialize print layout controls
        updatePrintLayout();
        
        // Initialize Lucide icons
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
