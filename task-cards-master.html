<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cards - All Subjects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=HarmonyOS+Sans:opsz,wght@8..48,300;8..48,400;8..48,500;8..48,600;8..48,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            /* Base font sizes for consistent scaling */
            --base-font-size: 14px;
            --base-line-height: 1.4;
            --title-size: 1.2em;
            --difficulty-size: 0.8em;
            --card-number-size: 1.1em;
            --subject-tag-size: 8px;
            
            /* Default layout values */
            --cards-per-row: 3;
            --card-gap: 40px;
            --card-font-scale: 1;
            --card-margin: 20px;
        }
        
        body {
            font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: white; /* Pure white background for printing */
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            /* Removed shadow for cleaner appearance */
            position: relative;
        }

        .header h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-family: 'Bebas Neue', cursive;
            font-size: 32px;
            letter-spacing: 1.5px;
        }

        /* Collapsible Controls */
        .controls-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .controls-toggle:hover {
            background: #f8f9fa;
            border-color: #999;
        }

        .controls-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            /* Removed shadow for cleaner interface */
            z-index: 999;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 80px 20px 20px;
            border-left: 1px solid #ddd;
        }

        .controls-drawer.open {
            right: 0;
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-row label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            min-width: 120px;
        }

        .control-row input, .control-row select {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .control-row input[type="range"] {
            flex: 1;
        }

        .range-display {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: #007bff;
        }

        /* Print Layout Controls */
        .layout-preview {
            display: grid;
            gap: 2px;
            margin: 10px 0;
            max-width: 100px;
        }

        .layout-preview .preview-card {
            background: #007bff;
            border-radius: 2px;
            height: 15px;
        }

        /* Card Selection */
        .selection-actions {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .selection-actions button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .selection-actions button:hover {
            background: #e9ecef;
        }

        .selection-counter {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .filter-group select, .filter-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .stats {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--cards-per-row, 3), 1fr);
            gap: var(--card-gap, 40px);
            margin-top: 20px;
            padding-right: 60px; /* Extra padding to prevent cutoff */
        }

        /* Hamilton-style task card design */
        .task-card {
            border: 2px solid;
            border-radius: 8px;
            padding: 15px;
            background: white;
            width: 100%;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin-bottom: var(--card-margin, 20px);
            cursor: pointer;
            transition: all 0.2s ease;
            /* Apply font scaling to entire card */
            font-size: calc(var(--base-font-size, 14px) * var(--card-font-scale, 1));
            line-height: calc(var(--base-line-height, 1.4) * var(--card-font-scale, 1));
        }

        .task-card.selected {
            border-width: 4px;
            border-style: dashed;
            transform: scale(1.02);
        }

        /* Selection mode styling */
        .selection-mode .task-card {
            cursor: pointer;
        }
        
        .selection-mode .task-card:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .selection-mode-toggle {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
            font-size: 14px;
        }

        .selection-mode-toggle.active {
            background: #dc3545;
        }

        .selection-mode-toggle:hover {
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(var(--cards-per-row, 3), 1fr);
            gap: var(--card-gap, 40px);
            margin-top: 20px;
        }

        /* Apply comprehensive font scaling to ALL card elements */
        .task-card,
        .task-card * {
            font-size: inherit;
        }

        .task-card {
            font-size: calc(1em * var(--card-font-scale, 1));
        }

        .task-card .card-title {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(24px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1.5px;
            flex-grow: 1;
        }

        .task-card .instructions {
            font-size: calc(12px * var(--card-font-scale, 1)) !important;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-card .directions h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .task-card .directions ol {
            margin-left: 0px; /* Remove margin so numbers align with title */
            padding-left: 18px; /* Add padding to create proper indentation */
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
        }

        .task-card .directions li {
            margin-bottom: 4px;
            line-height: 1.4;
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
            font-weight: normal; /* Keep direction text normal weight */
            color: inherit; /* Inherit color from difficulty level */
        }

        .task-card .directions li::marker {
            font-weight: bold; /* Make numbers bold */
            color: inherit; /* Color-code numbers to match difficulty */
        }

        .task-card .sentence-frame h3,
        .task-card .hints h3,
        .task-card .full-width-hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1)) !important;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .task-card .sentence-frame p {
            font-style: italic;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .hints ul,
        .task-card .full-width-hints ul {
            margin-left: 15px;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .hints li,
        .task-card .full-width-hints li {
            margin-bottom: 3px;
            line-height: 1.3;
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
        }

        .task-card .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1)) !important;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }

        .task-card .difficulty-label {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(11px * var(--card-font-scale, 1)) !important;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .task-card .subject-tag {
            position: absolute;
            bottom: 5px;
            left: 15px;
            background: white;
            color: #666;
            font-size: calc(9px * var(--card-font-scale, 1)) !important;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #ddd;
            font-weight: 400;
        }

        :root {
            --cards-per-row: 3;
            --card-gap: 40px;
            --card-margin: 20px;
            --card-font-scale: 1;
        }

        .task-card .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Bebas Neue', cursive;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }

        .task-card .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .task-card .card-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 1.5px;
            flex-grow: 1;
            white-space: nowrap; /* Prevent wrapping, use dynamic sizing instead */
            overflow: hidden; /* Hide overflow if any */
            margin-right: 25px; /* Reserve space for card number */
        }

        .task-card .card-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .task-card .difficulty-label {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(11px * var(--card-font-scale, 1));
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: 5px;
        }

        .task-card .instructions {
            font-size: calc(12px * var(--card-font-scale, 1));
            font-weight: 600;
            margin-bottom: 15px;
            line-height: calc(1.5 * var(--card-font-scale, 1));
        }

        .task-card .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .task-card .directions {
            margin-bottom: 15px;
        }

        .task-card .directions h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(16px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .directions ol {
            margin-left: 18px;
            font-size: 11px;
        }

        .task-card .directions li {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .task-card .bottom-sections {
            display: grid;
            grid-template-columns: minmax(120px, 0.6fr) 1fr; /* Responsive: sentence frame can be smaller but not too small */
            gap: 15px;
            margin-top: auto;
        }

        .task-card .sentence-frame {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
            font-style: italic;
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .sentence-frame h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            font-style: normal;
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .hints {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
        }

        .task-card .hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .hints ul {
            margin-left: 0; /* Remove left margin */
            padding-left: 15px; /* Reduce padding from 18px to 15px for tighter spacing */
            list-style-position: outside; /* Ensure bullets are outside the content area */
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .hints li {
            margin-bottom: calc(3px * var(--card-font-scale, 1));
            line-height: calc(1.3 * var(--card-font-scale, 1));
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
            font-weight: normal; /* Keep hint text normal weight */
            color: inherit; /* Inherit color from difficulty level */
        }

        .task-card .hints li::marker {
            font-weight: bold; /* Make bullets bold */
            color: inherit; /* Color-code bullets to match difficulty */
        }

        .task-card .full-width-hints {
            border-top: 2px solid #dee2e6;
            padding-top: 10px;
            margin-top: auto;
            grid-column: 1 / -1;
        }

        .task-card .full-width-hints h3 {
            font-family: 'Bebas Neue', cursive;
            font-size: calc(14px * var(--card-font-scale, 1));
            font-weight: 400;
            letter-spacing: calc(1px * var(--card-font-scale, 1));
            margin-bottom: calc(8px * var(--card-font-scale, 1));
        }

        .task-card .full-width-hints ul {
            margin-left: 0; /* Remove left margin */
            padding-left: 15px; /* Reduce padding from 18px to 15px for tighter spacing */
            list-style-position: outside; /* Ensure bullets are outside the content area */
            font-size: calc(10px * var(--card-font-scale, 1));
        }

        .task-card .full-width-hints li {
            margin-bottom: calc(3px * var(--card-font-scale, 1));
            line-height: calc(1.3 * var(--card-font-scale, 1));
            font-size: calc(10px * var(--card-font-scale, 1)) !important;
            font-weight: normal; /* Keep hint text normal weight */
            color: inherit; /* Inherit color from difficulty level */
        }

        .task-card .full-width-hints li::marker {
            font-weight: bold; /* Make bullets bold */
            color: inherit; /* Color-code bullets to match difficulty */
        }

        /* Additional specificity for consistent hint sizing - Base CSS override */
        .task-card .hints,
        .task-card .full-width-hints {
            font-size: calc(10px * var(--card-font-scale, 1)) !important; /* Force container font size */
        }

        .task-card .hints *,
        .task-card .full-width-hints * {
            font-size: calc(10px * var(--card-font-scale, 1)) !important; /* Force all child elements */
        }

        .task-card .hints li,
        .task-card .full-width-hints li {
            font-size: calc(10px * var(--card-font-scale, 1)) !important; /* Double-force list items */
            font-weight: normal !important; /* Keep text normal weight */
            color: inherit !important; /* Force color inheritance */
        }

        .task-card .hints li::marker,
        .task-card .full-width-hints li::marker {
            font-weight: bold !important; /* Force bold bullets */
            color: inherit !important; /* Force color-coded bullets */
        }

        .task-card .subject-tag {
            position: absolute;
            bottom: 10px;
            left: 15px;
            background: transparent;
            color: #999;
            font-size: 8px;
            padding: 0;
            border: none;
            border-radius: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        /* Easy Level Colors - Green */
        .task-card.easy {
            border-color: #28a745;
        }
        
        .task-card.easy .card-header {
            border-color: #28a745;
        }
        
        .task-card.easy .card-title,
        .task-card.easy .card-icon,
        .task-card.easy .difficulty-label,
        .task-card.easy .card-number,
        .task-card.easy .directions h3,
        .task-card.easy .sentence-frame h3,
        .task-card.easy .hints h3,
        .task-card.easy .full-width-hints h3 {
            color: #28a745;
        }

        .task-card.easy .directions li,
        .task-card.easy .hints li,
        .task-card.easy .full-width-hints li {
            color: #333; /* Keep text black */
        }

        .task-card.easy .directions li::marker,
        .task-card.easy .hints li::marker,
        .task-card.easy .full-width-hints li::marker {
            color: #28a745; /* Force green on markers only */
            font-weight: bold; /* Make markers bold */
        }

        /* Medium Level Colors - Orange */
        .task-card.medium {
            border-color: #fd7e14;
        }
        
        .task-card.medium .card-header {
            border-color: #fd7e14;
        }
        
        .task-card.medium .card-title,
        .task-card.medium .card-icon,
        .task-card.medium .difficulty-label,
        .task-card.medium .card-number,
        .task-card.medium .directions h3,
        .task-card.medium .sentence-frame h3,
        .task-card.medium .hints h3,
        .task-card.medium .full-width-hints h3 {
            color: #fd7e14;
        }

        .task-card.medium .directions li,
        .task-card.medium .hints li,
        .task-card.medium .full-width-hints li {
            color: #333; /* Keep text black */
        }

        .task-card.medium .directions li::marker,
        .task-card.medium .hints li::marker,
        .task-card.medium .full-width-hints li::marker {
            color: #fd7e14; /* Force orange on markers only */
            font-weight: bold; /* Make markers bold */
        }

        /* Hard Level Colors - Red */
        .task-card.hard {
            border-color: #dc3545;
        }
        
        .task-card.hard .card-header {
            border-color: #dc3545;
        }
        
        .task-card.hard .card-title,
        .task-card.hard .card-icon,
        .task-card.hard .difficulty-label,
        .task-card.hard .card-number,
        .task-card.hard .directions h3,
        .task-card.hard .sentence-frame h3,
        .task-card.hard .hints h3,
        .task-card.hard .full-width-hints h3 {
            color: #dc3545;
        }

        .task-card.hard .directions li,
        .task-card.hard .hints li,
        .task-card.hard .full-width-hints li {
            color: #333; /* Keep text black */
        }

        .task-card.hard .directions li::marker,
        .task-card.hard .hints li::marker,
        .task-card.hard .full-width-hints li::marker {
            color: #dc3545; /* Force red on markers only */
            font-weight: bold; /* Make markers bold */
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .no-cards {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 8px;
        }

        /* Print styles - comprehensive rewrite for true WYSIWYG */
        @media print {
            @page {
                size: auto;
                margin: 6px; /* Small consistent margin - half the card gap (12px/2 = 6px) */
            }
            
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: 'HarmonyOS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
                -webkit-print-color-adjust: exact !important; /* Preserve colors in WebKit browsers */
                print-color-adjust: exact !important; /* Standard property for color preservation */
                color-adjust: exact !important; /* Alternative property */
            }
            
            .header,
            .controls-toggle,
            .controls-drawer,
            .loading,
            .error,
            .no-cards {
                display: none !important;
            }
            
            .cards-grid {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important; /* Fixed 3 columns instead of variable */
                gap: 12px !important; /* 60% of 20px = 12px */
                margin: 0 !important;
                padding: 0 !important; /* Remove padding since page margin handles spacing */
                page-break-before: avoid;
                max-width: none !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            
            .task-card {
                box-shadow: none !important;
                border: 1px solid #333 !important; /* 60% of 2px = 1.2px, rounded to 1px */
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin: 0 !important;
                background: white !important;
                transform: none !important;
                width: 100% !important;
                height: auto !important; /* Let height be determined by content */
                min-height: 180px !important; /* 60% of 300px = 180px */
                max-height: none !important; /* Remove max-height restrictions */
                display: flex !important;
                flex-direction: column !important;
                position: relative !important;
                border-radius: 5px !important; /* 60% of 8px = 4.8px, rounded to 5px */
                padding: 7px !important; /* 60% of 12px = 7.2px, rounded to 7px */
                font-size: 7px !important; /* 60% of 11px = 6.6px, rounded to 7px */
                line-height: 1.3 !important; /* Keep line height the same for readability */
                box-sizing: border-box !important;
            }

            /* Preserve all color coding for difficulty levels */
            .task-card.easy {
                border-color: #28a745 !important; /* Green for Easy */
            }

    <script>
        // Configuration - now with series support
        const CODA_CONFIG = {
            docId: 'xmloQUGg-g',
            apiToken: '3f19aabb-ed6a-4bb1-9dc6-5cb058fcd94c',
            tableId: 'grid-MbORljz5rl',
            columns: {
                cardNumber: 'c-oCblzlJHpK',
                difficulty: 'c-R3MiGsbDIh',
                title: 'c-AaNuPckhD2',
                icon: 'c-ic9sO6dOFA',
                instructions: 'c-5Wm1KWBumn',
                directions: 'c-UdatLRw4ZE',
                sentenceFrame: 'c-PTc-M6N93s',
                hints: 'c-J2p_hAW8aK',
                subject: 'c-PvCf__AtLS', // Correct subject column ID
                unit: 'c-VMuDoulorO',     // Correct unit column ID
                series: 'c-OBxHtN8XaH' // Series column for specific sets
            }
        };

        let allCards = [];
        let filteredCards = [];

        // Load task cards from Coda
        async function loadTaskCards() {
            try {
                console.log('🔄 Loading task cards from Coda...');
                console.log('📋 Config:', CODA_CONFIG);
                
                // Add timeout to prevent hanging
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(`https://coda.io/apis/v1/docs/${CODA_CONFIG.docId}/tables/${CODA_CONFIG.tableId}/rows`, {
                    headers: {
                        'Authorization': `Bearer ${CODA_CONFIG.apiToken}`,
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ HTTP Error details:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('✅ Raw data from Coda:', data);
                console.log('✅ Loaded', data.items?.length || 0, 'task cards from Coda');
                
                if (!data.items || data.items.length === 0) {
                    throw new Error('No task cards found in the database');
                }
                
                allCards = data.items.map(item => {
                    const values = item.values;
                    return {
                        id: item.id,
                        cardNumber: values[CODA_CONFIG.columns.cardNumber] || '',
                        difficulty: values[CODA_CONFIG.columns.difficulty] || 'Easy',
                        title: values[CODA_CONFIG.columns.title] || 'Untitled Card',
                        icon: values[CODA_CONFIG.columns.icon] || 'help-circle',
                        instructions: values[CODA_CONFIG.columns.instructions] || '',
                        directions: values[CODA_CONFIG.columns.directions] || '',
                        sentenceFrame: values[CODA_CONFIG.columns.sentenceFrame] || '',
                        hints: values[CODA_CONFIG.columns.hints] || '',
                        subject: values[CODA_CONFIG.columns.subject] || 'Unknown',
                        unit: values[CODA_CONFIG.columns.unit] || 'Unknown',
                        series: values[CODA_CONFIG.columns.series] || 'Unknown'
                    };
                });

                // Sort cards: Series together, then Easy→Medium→Hard, then sequential within each
                allCards.sort((a, b) => {
                    // First sort by series
                    if (a.series !== b.series) {
                        return a.series.localeCompare(b.series);
                    }
                    
                    // Then sort by difficulty (Easy, Medium, Hard)
                    const difficultyOrder = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
                    const aDiff = difficultyOrder[a.difficulty] || 999;
                    const bDiff = difficultyOrder[b.difficulty] || 999;
                    
                    if (aDiff !== bDiff) {
                        return aDiff - bDiff;
                    }
                    
                    // Finally sort by card number (sequential within difficulty)
                    const aNum = parseInt(a.cardNumber) || 0;
                    const bNum = parseInt(b.cardNumber) || 0;
                    return aNum - bNum;
                });
                
                populateFilterOptions();
                applyFilters();
                document.getElementById('loadingMessage').style.display = 'none';
                
            } catch (error) {
                console.error('❌ Failed to load task cards:', error);
                
                let errorMessage = 'Failed to load task cards. ';
                if (error.name === 'AbortError') {
                    errorMessage += 'Request timed out after 30 seconds.';
                } else if (error.message.includes('CORS')) {
                    errorMessage += 'Cross-origin request blocked. Try accessing the page from the GitHub Pages URL.';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage += 'Network error. Check your internet connection.';
                } else {
                    errorMessage += error.message;
                }
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').innerHTML = `❌ ${errorMessage}`;
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        // Populate filter dropdown options
        function populateFilterOptions() {
            const subjects = [...new Set(allCards.map(card => card.subject))].sort();
            const units = [...new Set(allCards.map(card => card.unit))].sort();
            const series = [...new Set(allCards.map(card => card.series))].sort();
            
            const subjectSelect = document.getElementById('subjectFilter');
            const unitSelect = document.getElementById('unitFilter');
            const seriesSelect = document.getElementById('seriesFilter');
            
            // Clear existing options (except first "All" option)
            [subjectSelect, unitSelect, seriesSelect].forEach(select => {
                while (select.children.length > 1) {
                    select.removeChild(select.lastChild);
                }
            });
            
            subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject;
                option.textContent = subject;
                subjectSelect.appendChild(option);
            });
            
            units.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });
            
            series.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s;
                seriesSelect.appendChild(option);
            });
        }

        // Apply filters
        function applyFilters() {
            const subjectFilter = document.getElementById('subjectFilter').value;
            const unitFilter = document.getElementById('unitFilter').value;
            const seriesFilter = document.getElementById('seriesFilter').value;
            const difficultyFilter = document.getElementById('difficultyFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            const showOnlySelected = document.getElementById('showOnlySelected')?.checked;

            filteredCards = allCards.filter(card => {
                if (subjectFilter && card.subject !== subjectFilter) return false;
                if (unitFilter && card.unit !== unitFilter) return false;
                if (seriesFilter && card.series !== seriesFilter) return false;
                if (difficultyFilter && card.difficulty !== difficultyFilter) return false;
                if (searchFilter) {
                    const searchText = `${card.title} ${card.instructions}`.toLowerCase();
                    if (!searchText.includes(searchFilter)) return false;
                }
                
                // Apply selection filter if enabled
                if (showOnlySelected && selectedCards && selectedCards.size > 0) {
                    const cardId = `card-${card.cardNumber}-${card.series}`;
                    if (!selectedCards.has(cardId)) return false;
                }
                
                return true;
            });

            renderCards();
            updateStats();
        }

        // Render cards
        function renderCards() {
            const cardsGrid = document.getElementById('cardsGrid');
            const noCards = document.getElementById('noCards');
            
            if (filteredCards.length === 0) {
                cardsGrid.innerHTML = '';
                noCards.style.display = 'block';
                return;
            }
            
            noCards.style.display = 'none';
            cardsGrid.innerHTML = filteredCards.map(createTaskCardHtml).join('');
            
            // Initialize Lucide icons
            if (window.lucide) {
                window.lucide.createIcons();
            }
            
            // Apply dynamic font sizing to titles
            setTimeout(() => applyDynamicTitleSizing(), 100);
        }

        // Create HTML for a single task card
        function createTaskCardHtml(card) {
            const difficultyClass = card.difficulty.toLowerCase();
            const directionsHtml = formatDirections(card.directions);
            const hintsHtml = formatHints(card.hints);
            const cardId = `card-${card.cardNumber}-${card.series}`;
            
            // Check if this is a full-width hints layout (Medium/Hard without sentence frames)
            const hasFullWidthHints = !card.sentenceFrame && (card.difficulty === 'Medium' || card.difficulty === 'Hard');

            return `
                <div class="task-card ${difficultyClass}" data-card-id="${cardId}" onclick="handleCardClick(this)">
                    <div class="card-number">${card.cardNumber}</div>
                    <div class="subject-tag">${card.series}</div>
                    
                    <div class="card-header">
                        <i data-lucide="${card.icon}" class="card-icon"></i>
                        <div class="card-title">${card.title}</div>
                    </div>
                    
                    <div class="difficulty-label">${card.difficulty.toUpperCase()} LEVEL</div>
                    
                    <div class="card-content">
                        <div class="instructions">
                            ${boldKeyWords(card.instructions)}
                        </div>
                        
                        <div class="directions">
                            <h3>Directions:</h3>
                            ${boldKeyWords(directionsHtml)}
                        </div>

                        <div class="bottom-sections">
                            ${card.sentenceFrame ? `
                                <div class="sentence-frame">
                                    <h3>Sentence Frame:</h3>
                                    <p>${boldKeyWords(card.sentenceFrame)}</p>
                                </div>
                                <div class="hints">
                                    <h3>Helpful Hints:</h3>
                                    ${boldKeyWords(hintsHtml)}
                                </div>
                            ` : `
                                <div class="full-width-hints">
                                    <h3>Helpful Hints:</h3>
                                    ${boldKeyWords(hintsHtml)}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // Format directions text
        function formatDirections(directions) {
            if (!directions) return '<ol><li>No directions provided</li></ol>';
            
            // If it contains newlines, treat as separate list items
            if (directions.includes('\n')) {
                const items = directions.split('\n').map((item, index) => {
                    const cleaned = item.replace(/^\d+\.?\s*/, '').trim(); // Remove existing numbers
                    return cleaned ? `<li>${cleaned}</li>` : '';
                }).filter(item => item);
                
                return `<ol>${items.join('')}</ol>`;
            }
            
            return `<ol><li>${directions}</li></ol>`;
        }

        // Format hints text
        function formatHints(hints) {
            if (!hints) return '<ul><li>No hints provided</li></ul>';
            
            // If it contains newlines, treat as separate list items
            if (hints.includes('\n')) {
                const items = hints.split('\n').map(item => {
                    const cleaned = item.replace(/^[-*•]\s*/, '').trim(); // Remove bullet points
                    return cleaned ? `<li>${cleaned}</li>` : '';
                }).filter(item => item);
                
                return `<ul>${items.join('')}</ul>`;
            }
            
            return `<ul><li>${hints}</li></ul>`;
        }

        // Bold key words function
        function boldKeyWords(text) {
            if (!text) return text;
            
            // Define key words to bold (add more as needed)
            const keyWords = [
                // Action words
                'analyze', 'compare', 'contrast', 'identify', 'describe', 'explain', 'create', 'design', 'choose', 'find', 'list', 'write', 'discuss', 'track', 'map', 'trace', 'show', 'demonstrate',
                
                // Hamilton-specific terms
                'Hamilton', 'Washington', 'Burr', 'Jefferson', 'Eliza', 'Angelica', 'cabinet', 'duel', 'immigrant', 'founding father', 'revolution', 'federalist', 
                
                // Literary terms
                'character', 'theme', 'conflict', 'motivation', 'relationship', 'development', 'change', 'growth', 'flaw', 'strength', 
                
                // Important concepts
                'power', 'ambition', 'legacy', 'sacrifice', 'loyalty', 'betrayal', 'decision', 'consequence', 'leadership', 'friendship', 'rivalry',
                
                // Musical terms
                'song', 'lyrics', 'rap', 'melody', 'rhythm', 'verse', 'chorus',
                
                // Analysis words
                'evidence', 'example', 'proof', 'reason', 'cause', 'effect', 'result', 'impact', 'influence', 'pattern'
            ];
            
            // Create regex pattern for all key words (case insensitive, whole words only)
            const pattern = new RegExp(`\\b(${keyWords.join('|')})\\b`, 'gi');
            
            // Replace matches with bold versions
            return text.replace(pattern, '<strong>$1</strong>');
        }

        // Dynamic font resizing for titles
        function adjustTitleFontSize(titleElement) {
            const container = titleElement.parentElement;
            const maxWidth = container.offsetWidth - 25; // Reserve space for card number (20px + 5px buffer)
            
            let fontSize = 24; // Start with original size (screen) or 14 (print)
            const isPrint = window.matchMedia('print').matches;
            if (isPrint) fontSize = 14;
            
            // Set initial font size
            titleElement.style.fontSize = fontSize + 'px';
            
            // Reduce font size until it fits
            while (titleElement.scrollWidth > maxWidth && fontSize > 8) {
                fontSize -= 1;
                titleElement.style.fontSize = fontSize + 'px';
            }
        }

        // Apply dynamic font sizing to all titles
        function applyDynamicTitleSizing() {
            const titles = document.querySelectorAll('.task-card .card-title');
            titles.forEach(title => {
                // Reset to auto first to get natural size
                title.style.fontSize = '';
                // Then adjust
                setTimeout(() => adjustTitleFontSize(title), 10);
            });
        }

        // Update stats
        function updateStats() {
            const stats = document.getElementById('stats');
            const total = allCards.length;
            const filtered = filteredCards.length;
            const difficulties = filteredCards.reduce((acc, card) => {
                acc[card.difficulty] = (acc[card.difficulty] || 0) + 1;
                return acc;
            }, {});

            stats.innerHTML = `
                Showing ${filtered} of ${total} cards | 
                Easy: ${difficulties.Easy || 0} | 
                Medium: ${difficulties.Medium || 0} | 
                Hard: ${difficulties.Hard || 0}
            `;
        }

        // Controls drawer functionality
        function toggleControlsDrawer() {
            const drawer = document.getElementById('controlsDrawer');
            const toggle = document.getElementById('controlsToggle');
            drawer.classList.toggle('open');
            
            // Update toggle icon
            const icon = toggle.querySelector('i');
            if (drawer.classList.contains('open')) {
                icon.setAttribute('data-lucide', 'x');
            } else {
                icon.setAttribute('data-lucide', 'settings');
            }
            window.lucide.createIcons();
        }

        // Print layout controls
        function updatePrintLayout() {
            const cardsPerRow = document.getElementById('cardsPerRow').value;
            const cardGap = document.getElementById('cardGap').value;
            const cardFontScale = document.getElementById('cardFontScale').value;
            
            // Update CSS custom properties
            document.documentElement.style.setProperty('--cards-per-row', cardsPerRow);
            document.documentElement.style.setProperty('--card-gap', cardGap + 'px');
            document.documentElement.style.setProperty('--card-font-scale', cardFontScale);
            
            // Update display values
            document.getElementById('cardsPerRowDisplay').textContent = cardsPerRow;
            document.getElementById('cardGapDisplay').textContent = cardGap + 'px';
            document.getElementById('cardFontScaleDisplay').textContent = Math.round(cardFontScale * 100) + '%';
            
            updateLayoutPreview(cardsPerRow);
        }

        function updateLayoutPreview(cardsPerRow) {
            const preview = document.getElementById('layoutPreview');
            preview.style.gridTemplateColumns = `repeat(${cardsPerRow}, 1fr)`;
            preview.innerHTML = Array.from({length: cardsPerRow * 2}, () => '<div class="preview-card"></div>').join('');
        }

        // Multi-select mode functionality
        let isSelectionMode = false;
        let selectedCards = new Set();
        
        function toggleSelectionMode() {
            isSelectionMode = !isSelectionMode;
            const toggleButton = document.getElementById('selectionModeToggle'); // Fixed ID
            const body = document.body;
            
            if (isSelectionMode) {
                toggleButton.textContent = 'Disable Multi-Select Mode';
                toggleButton.style.backgroundColor = '#dc3545';
                body.classList.add('selection-mode');
                selectedCards.clear();
            } else {
                toggleButton.textContent = 'Enable Multi-Select Mode';
                toggleButton.style.backgroundColor = '#28a745';
                body.classList.remove('selection-mode');
                selectedCards.clear();
                // Remove selected class from all cards
                document.querySelectorAll('.task-card.selected').forEach(card => {
                    card.classList.remove('selected');
                });
            }
            updateSelectionCounter();
        }
        
        function handleCardClick(cardElement) {
            if (isSelectionMode) {
                const cardId = cardElement.dataset.cardId;
                
                if (cardElement.classList.contains('selected')) {
                    cardElement.classList.remove('selected');
                    selectedCards.delete(cardId);
                } else {
                    cardElement.classList.add('selected');
                    selectedCards.add(cardId);
                }
                
                updateSelectionCounter();
                
                // Apply show only selected filter if enabled
                if (document.getElementById('showOnlySelected').checked) {
                    applyFilters();
                }
            }
        }

        function updateSelectionCounter() {
            document.getElementById('selectionCounter').textContent = `${selectedCards.size} cards selected`;
        }

        function selectAll() {
            if (!isSelectionMode) {
                // Enter selection mode first
                toggleSelectionMode();
            }
            
            document.querySelectorAll('.task-card:not([style*="display: none"])').forEach(card => {
                const cardId = card.dataset.cardId;
                card.classList.add('selected');
                selectedCards.add(cardId);
            });
            updateSelectionCounter();
        }

        function selectNone() {
            document.querySelectorAll('.task-card.selected').forEach(card => {
                card.classList.remove('selected');
            });
            selectedCards.clear();
            updateSelectionCounter();
        }

        function selectVisible() {
            if (!isSelectionMode) {
                // Enter selection mode first
                toggleSelectionMode();
            }
            
            document.querySelectorAll('.task-card:not([style*="display: none"])').forEach(card => {
                const cardId = card.dataset.cardId;
                card.classList.add('selected');
                selectedCards.add(cardId);
            });
            updateSelectionCounter();
        }
        
        function exportSelected() {
            if (!isSelectionMode || selectedCards.size === 0) {
                alert('Please select cards first by entering selection mode');
                return;
            }
            
            // Get selected card elements
            const selectedElements = Array.from(selectedCards).map(cardId => {
                return document.querySelector(`[data-card-id="${cardId}"]`);
            }).filter(el => el);
            
            if (selectedElements.length === 0) {
                alert('No valid cards selected');
                return;
            }

            const printWindow = window.open('', '_blank');
            const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Selected Task Cards</title>
                    <style>
                        body { 
                            font-family: Arial, sans-serif; 
                            margin: 20px; 
                            background: white;
                            line-height: 1.4;
                        }
                        .task-card { 
                            border: 2px solid #333; 
                            margin: 20px 0; 
                            padding: 20px; 
                            page-break-inside: avoid;
                            background: white;
                        }
                        .card-header { display: flex; align-items: center; margin-bottom: 10px; }
                        .card-icon { margin-right: 10px; }
                        .card-title { font-size: 18px; font-weight: bold; }
                        .difficulty-label { font-weight: bold; margin-bottom: 10px; }
                        .directions, .hints, .sentence-frame { margin: 10px 0; }
                        .directions h3, .hints h3, .sentence-frame h3 { 
                            font-size: 14px; 
                            margin: 5px 0; 
                            color: #333;
                        }
                        .subject-tag { 
                            font-size: 10px; 
                            color: #666; 
                            margin-bottom: 5px;
                        }
                    </style>
                </head>
                <body>
                    ${selectedElements.map(card => card.outerHTML).join('')}
                </body>
                </html>
            `;
            
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
        }

        // Event listeners - wrapped in DOMContentLoaded to ensure DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Check for required elements and add event listeners only if they exist
            const controlsToggle = document.getElementById('controlsToggle');
            if (controlsToggle) controlsToggle.addEventListener('click', toggleControlsDrawer);
            
            const selectionModeToggle = document.getElementById('selectionModeToggle');
            if (selectionModeToggle) selectionModeToggle.addEventListener('click', toggleSelectionMode);
            
            const subjectFilter = document.getElementById('subjectFilter');
            if (subjectFilter) subjectFilter.addEventListener('change', applyFilters);
            
            const unitFilter = document.getElementById('unitFilter');
            if (unitFilter) unitFilter.addEventListener('change', applyFilters);
            
            const seriesFilter = document.getElementById('seriesFilter');
            if (seriesFilter) seriesFilter.addEventListener('change', applyFilters);
            
            const difficultyFilter = document.getElementById('difficultyFilter');
            if (difficultyFilter) difficultyFilter.addEventListener('change', applyFilters);
            
            const searchFilter = document.getElementById('searchFilter');
            if (searchFilter) searchFilter.addEventListener('input', applyFilters);
            
            const showOnlySelected = document.getElementById('showOnlySelected');
            if (showOnlySelected) showOnlySelected.addEventListener('change', applyFilters);
            
            // Print layout controls
            const cardsPerRow = document.getElementById('cardsPerRow');
            if (cardsPerRow) cardsPerRow.addEventListener('input', updatePrintLayout);
            
            const cardGap = document.getElementById('cardGap');
            if (cardGap) cardGap.addEventListener('input', updatePrintLayout);
            
            const cardFontScale = document.getElementById('cardFontScale');
            if (cardFontScale) cardFontScale.addEventListener('input', updatePrintLayout);

            // Initialize the application after DOM is ready
            loadTaskCards();
            
            // Initialize print layout controls
            updatePrintLayout();
            
            // Listen for print media changes to reapply font sizing
            const printMediaQuery = window.matchMedia('print');
            printMediaQuery.addListener(function(e) {
                if (e.matches) {
                    // Entering print mode
                    setTimeout(() => applyDynamicTitleSizing(), 50);
                }
            });
            
            // Initialize Lucide icons
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
